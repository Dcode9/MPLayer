<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    (function () {
      const path = window.location.pathname || '/home/';
      const homeMarker = '/home/';
      const markerIndex = path.indexOf(homeMarker);
      const base = markerIndex >= 0 ? path.slice(0, markerIndex) : '';
      window.location.replace(base + '/home/index.html' + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body></body>
</html>
