<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Tunes</title>
    <link rel="icon" href="data:,">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent-color: #3ecf8e;
            --album-art-gradient: conic-gradient(from 0deg, #434343, #000000, #434343);
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            background-color: #050505; 
            color: white;
            overscroll-behavior: none; /* Prevents bounce effect */
        }

        /* --- Minimal Scrollbars --- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }

        /* --- Universal Glass --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- Advanced Marquee Engine --- */
        .marquee-container {
            width: 100%; overflow: hidden; display: flex; align-items: center;
        }
        .marquee-container.is-overflowing {
            mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
        }
        .marquee-text {
            display: inline-block; white-space: nowrap;
        }
        .marquee-text.is-overflowing {
            animation: js-slide-text var(--scroll-dur, 5s) linear infinite alternate;
        }
        .hover-pause:hover .marquee-text { animation-play-state: paused !important; }
        
        @keyframes js-slide-text {
            0%, 15% { transform: translateX(0); }
            85%, 100% { transform: translateX(var(--scroll-dist)); }
        }

        /* --- Unified Song Pill (Matches Now Playing perfectly) --- */
        .song-pill {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem; padding-right: 1rem;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem; cursor: pointer; transition: border-color 0.2s; user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        .song-pill:hover { border-color: rgba(255, 255, 255, 0.3); }
        .song-pill img { width: 3rem; height: 3rem; border-radius: 0.75rem; object-fit: cover; flex-shrink: 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.1); }
        .song-pill-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }

        /* --- Horizontal Scroll Logic --- */
        .horizontal-scroll {
            display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem;
            scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none;
            padding-left: 2rem; padding-right: 2rem;
        }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .scroll-card { flex-shrink: 0; flex-basis: calc((100% - (2 * 1rem)) / 2.5); min-width: 0; user-select: none; }
        @media (min-width: 768px) { .scroll-card { flex-basis: calc((100% - (4 * 1rem)) / 4.5); } }
        @media (min-width: 1024px) { .scroll-card { flex-basis: calc((100% - (6 * 1rem)) / 6.5); } }

        /* --- Local Row Blurs --- */
        .row-blur-left {
            position: absolute; left: 0; top: 0; bottom: 16px; width: 48px; z-index: 10; pointer-events: none;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            mask-image: linear-gradient(to right, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 20%, transparent 100%);
        }
        .row-blur-right {
            position: absolute; right: 0; top: 0; bottom: 16px; width: 48px; z-index: 10; pointer-events: none;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            mask-image: linear-gradient(to left, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to left, black 20%, transparent 100%);
        }

        /* --- Search Bar & Smooth Dropdown --- */
        .search-input {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px; padding: 0.6rem 1rem 0.6rem 2.5rem; width: 100%;
            color: white; transition: all 0.3s;
        }
        .search-input:focus { outline: none; border-color: var(--accent-color); background: rgba(255, 255, 255, 0.08); }
        .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: #9ca3af; pointer-events: none; }
        
        .search-dropdown-wrapper {
            position: absolute; top: 100%; left: -20px; right: -20px; padding: 20px; 
            pointer-events: none; z-index: 100; visibility: hidden;
        }
        .search-blur-bg {
            inset: 0; border-radius: 2rem; position: absolute; background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); pointer-events: none;
            mask-image: radial-gradient(ellipse at top, black 50%, transparent 90%);
            -webkit-mask-image: radial-gradient(ellipse at top, black 50%, transparent 90%);
            opacity: 0; transition: opacity 0.3s;
        }
        .search-results-content {
            position: relative; z-index: 10; background: transparent; border-radius: 1.5rem;
            max-height: 50vh; overflow: hidden; display: flex; flex-direction: column; gap: 0.25rem;
            opacity: 0; transform: translateY(-10px); transition: all 0.3s ease;
        }
        .search-dropdown-wrapper.active { pointer-events: auto; visibility: visible; }
        .search-dropdown-wrapper.active .search-blur-bg { opacity: 1; }
        .search-dropdown-wrapper.active .search-results-content { opacity: 1; transform: translateY(0); padding: 0.5rem; }

        /* --- Player Components --- */
        #seek-bar-container { position: relative; width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s; touch-action: none; }
        #seek-bar-container.disabled { opacity: 0.3; pointer-events: none; }
        
        #seek-bar-track { position: absolute; height: 2px; width: 100%; background-color: rgba(255, 255, 255, 0.15); border-radius: 3px; top: 50%; transform: translateY(-50%); clip-path: inset(0 0 0 0%); transition: height 0.2s; pointer-events: none; }
        #visualizer-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; clip-path: inset(0 100% 0 0); }
        
        input[type="range"]#seek-bar { 
            -webkit-appearance: none; appearance: none; position: absolute; left: 0; width: 100%; 
            background: transparent; outline: none; margin: 0; padding: 0; z-index: 2; cursor: pointer;
            height: 20px; top: 50%; transform: translateY(-50%);
        }
        input[type="range"]#seek-bar::-webkit-slider-runnable-track { width: 100%; height: 2px; background: transparent; }
        input[type="range"]#seek-bar::-webkit-slider-thumb { 
            -webkit-appearance: none; appearance: none; width: 12px; height: 12px; background: #fff; 
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: transform 0.1s; 
            margin-top: -5px; 
        }
        input[type="range"]#seek-bar:disabled::-webkit-slider-thumb { display: none; }
        input[type="range"]#seek-bar::-webkit-slider-thumb:hover { transform: scale(1.5); }
        
        #seek-tooltip { position: absolute; top: -35px; background: rgba(0, 0, 0, 0.9); color: white; font-size: 11px; font-family: monospace; padding: 4px 8px; border-radius: 4px; pointer-events: none; opacity: 0; transform: translateX(-50%) translateY(10px); transition: opacity 0.2s ease, transform 0.2s ease; z-index: 20; border: 1px solid rgba(255, 255, 255, 0.1); white-space: nowrap; }
        #seek-tooltip.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

        #album-art-glow { position: absolute; inset: -6px; z-index: -1; background: var(--album-art-gradient); filter: blur(15px); opacity: 0.8; animation: spin 8s linear infinite; border-radius: 50%; will-change: transform; }
        @keyframes spin { from { --angle: 0deg; } to { --angle: 360deg; } }
        button.active-state { color: var(--accent-color); }
        #background-playing { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 1.5s ease, background 1.5s ease; }

        /* --- Click-to-Expand Queue Logic --- */
        #queue-blur-bg { 
            position: absolute; inset: -40px; border-radius: 3rem; z-index: 0;
            background: transparent; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); pointer-events: none; opacity: 0; transition: opacity 0.4s;
            mask-image: radial-gradient(ellipse at center bottom, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center bottom, black 40%, transparent 80%);
        }
        
        #player-active-area { position: relative; width: 100%; display: flex; flex-direction: column; z-index: 20; }
        
        #queue-expandable-area {
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            max-height: 0; opacity: 0; overflow: hidden; width: 100%; display: flex; flex-direction: column;
        }

        #queue-preview-slot { 
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; 
            max-height: 0; opacity: 0; overflow: hidden; width: 100%; 
        }

        /* 10-Second Auto-Preview State */
        #queue-wrapper.preview-expanded #queue-blur-bg { opacity: 1; }
        #queue-wrapper.preview-expanded #queue-preview-slot { max-height: 100px; opacity: 1; margin-top: 0.5rem; }
        
        /* Full Expanded State */
        #queue-wrapper.queue-expanded #queue-blur-bg { opacity: 1; }
        #queue-wrapper.queue-expanded #queue-expandable-area { max-height: 500px; opacity: 1; pointer-events: auto; }
        #queue-wrapper.queue-expanded #btn-expand-queue { transform: rotate(180deg); color: white; opacity: 1; width: 2rem; }

        /* Seamless Morph Swap Animation */
        #queue-wrapper.track-swap-out #info-island { transform: translateY(-20px); opacity: 0; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #queue-wrapper.track-swap-out #up-next-label { opacity: 0; transition: opacity 0.2s; }
        #queue-wrapper.track-swap-out #queue-preview-pill { transform: translateY(-70px); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        #queue-full-content { opacity: 0; transition: opacity 0.3s; pointer-events: none; display: flex; flex-direction: column; flex: 1; min-height: 0; }
        #queue-wrapper.queue-expanded #queue-full-content { opacity: 1; position: relative; pointer-events: auto; transition-delay: 0.1s; }
        #queue-tabs { position: relative; z-index: 20; }

        /* Modal Overlay */
        #playlist-modal, #playlist-selector-modal { transition: opacity 0.3s ease; }
        #playlist-modal.hidden, #playlist-selector-modal.hidden { opacity: 0; pointer-events: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
    </style>
</head>
<body>

    <!-- Dynamic Playing Background -->
    <div id="background-playing"></div>

    <!-- PLAYLIST MODALS -->
    <div id="playlist-modal" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
        <div class="glass-panel p-6 rounded-2xl w-full max-w-sm shadow-2xl border border-white/10 transform transition-transform">
            <h3 class="text-xl font-bold text-white mb-4">Create Playlist</h3>
            <input type="text" id="new-playlist-name" placeholder="My Awesome Mix" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white mb-6 focus:outline-none focus:border-green-400 transition" autocomplete="off">
            <div class="flex justify-end gap-3">
                <button onclick="ui.toggleModal(false)" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">Cancel</button>
                <button onclick="ui.createPlaylist()" class="px-4 py-2 rounded-lg bg-green-500 text-black font-bold hover:scale-105 transition shadow-lg shadow-green-500/30">Create</button>
            </div>
        </div>
    </div>

    <div id="playlist-selector-modal" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden" onclick="if(event.target === this) this.classList.add('hidden')">
        <div class="glass-panel p-6 rounded-2xl w-full max-w-sm shadow-2xl border border-white/10">
            <h3 class="text-xl font-bold text-white mb-4" id="pl-sel-title">Add to Playlist</h3>
            <div id="playlist-selector-list" class="flex flex-col gap-2 max-h-60 overflow-y-auto custom-scrollbar mb-4"></div>
            <button onclick="document.getElementById('playlist-selector-modal').classList.add('hidden')" class="w-full px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 transition">Cancel</button>
        </div>
    </div>

    <!-- GLOBAL CONTEXT MENU -->
    <div id="context-menu" class="fixed z-[100] hidden bg-[#181818] border border-white/10 rounded-xl shadow-2xl overflow-hidden py-1 w-48 text-sm">
        <div id="cm-song-options">
            <button id="cm-play-next" class="w-full text-left px-4 py-2 hover:bg-white/10 text-white flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg> Play Next</button>
            <button id="cm-add-queue" class="w-full text-left px-4 py-2 hover:bg-white/10 text-white flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h10m-10 4h6"/></svg> Add to Queue</button>
            <div class="h-px bg-white/10 my-1"></div>
            <button id="cm-add-playlist" class="w-full text-left px-4 py-2 hover:bg-white/10 text-white flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Add to Playlist</button>
        </div>
        <div id="cm-playlist-options" class="hidden">
            <button id="cm-pl-play" class="w-full text-left px-4 py-2 hover:bg-white/10 text-white flex items-center gap-2 transition"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play All</button>
            <div class="h-px bg-white/10 my-1"></div>
            <button id="cm-pl-delete" class="w-full text-left px-4 py-2 hover:bg-red-500/20 text-red-400 flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg> Delete Playlist</button>
        </div>
    </div>

    <!-- TOP HEADER (Floating Glass) -->
    <header class="fixed top-4 left-6 right-6 z-40 glass-panel rounded-2xl px-6 py-3 flex items-center justify-between gap-4 shadow-xl">
        <div class="flex items-center gap-2 text-2xl font-bold text-white cursor-pointer w-32 flex-shrink-0" onclick="ui.switchView('home')">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-green-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span class="hidden sm:block">D'Tunes</span>
        </div>

        <div class="flex-1 flex justify-center w-full" id="search-wrapper">
            <div class="flex items-center gap-2 w-full max-w-2xl relative">
                <button class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-300 hover:text-white transition flex-shrink-0" onclick="ui.switchView('home')" title="Home">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                </button>
                
                <div class="relative flex-1">
                    <svg class="search-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Search and press Enter..." autocomplete="off">
                    
                    <div class="search-dropdown-wrapper" id="search-dropdown">
                        <div class="search-blur-bg"></div>
                        <div class="search-results-content" id="search-results"></div>
                    </div>
                </div>

                <button class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-300 hover:text-white transition flex-shrink-0" onclick="ui.toggleModal(true)" title="Create Playlist">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                </button>
            </div>
        </div>
        
        <div class="w-32 hidden md:block flex-shrink-0"></div>
    </header>

    <!-- MAIN SCROLLABLE CONTENT -->
    <main id="main-container" class="h-screen overflow-y-auto pt-32 pb-48">
        
        <!-- ================= HOME VIEW ================= -->
        <div id="view-home">
            <section id="section-trending" class="mb-12 hidden relative">
                <h2 class="text-2xl font-bold text-white mb-6 px-8">Trending Right Now</h2>
                <div class="row-blur-left"></div><div id="trending-grid" class="horizontal-scroll"></div><div class="row-blur-right"></div>
            </section>

            <section id="section-quick-picks" class="mb-12 hidden relative">
                <h2 class="text-2xl font-bold text-white mb-6 px-8">Quick Picks For You</h2>
                <div class="row-blur-left"></div><div id="quick-picks-grid" class="horizontal-scroll"></div><div class="row-blur-right"></div>
            </section>

            <section id="section-recent" class="mb-12 hidden relative">
                <h2 class="text-2xl font-bold text-white mb-6 px-8">Recently Played</h2>
                <div class="row-blur-left"></div><div id="recent-grid" class="horizontal-scroll"></div><div class="row-blur-right"></div>
            </section>

            <section id="section-playlists" class="mb-12 relative">
                <h2 class="text-2xl font-bold text-white mb-6 px-8">Your Library</h2>
                <div class="row-blur-left"></div><div id="playlists-grid" class="horizontal-scroll items-stretch"></div><div class="row-blur-right"></div>
            </section>
        </div>

        <!-- ================= FULL SEARCH VIEW ================= -->
        <div id="view-search" class="hidden pb-12">
            <h2 class="text-3xl font-bold text-white mb-8 px-8" id="search-title">Search Results</h2>
            <div id="search-loading" class="text-gray-400 hidden px-8">Searching across the universe...</div>
            <div id="search-content" class="hidden">
                <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 mb-12 relative z-20 px-8">
                    <div class="lg:col-span-2 relative z-20">
                        <h3 class="text-xl font-bold text-gray-300 mb-4">Top Result</h3>
                        <div id="search-top-result" class="glass-panel rounded-2xl p-6 transition hover-pause group relative overflow-hidden h-80 flex flex-col justify-end cursor-pointer"></div>
                    </div>
                    <div class="lg:col-span-3 relative z-10">
                        <h3 class="text-xl font-bold text-gray-300 mb-4">Songs</h3>
                        <div id="search-songs-list" class="flex flex-col gap-2"></div>
                    </div>
                </div>

                <div class="mb-12 relative">
                    <h3 class="text-xl font-bold text-gray-300 mb-4 px-8">Albums</h3>
                    <div class="row-blur-left" style="top: 40px"></div><div id="search-albums-grid" class="horizontal-scroll"></div><div class="row-blur-right" style="top: 40px"></div>
                </div>
                <div class="mb-12 relative">
                    <h3 class="text-xl font-bold text-gray-300 mb-4 px-8">Artists</h3>
                    <div class="row-blur-left" style="top: 40px"></div><div id="search-artists-grid" class="horizontal-scroll"></div><div class="row-blur-right" style="top: 40px"></div>
                </div>
            </div>
        </div>

        <!-- ================= PLAYLIST / ALBUM VIEW ================= -->
        <div id="view-playlist" class="hidden pb-12 px-8">
            <div class="flex flex-col md:flex-row gap-8">
                <div class="md:w-[30%] flex-shrink-0">
                    <div class="sticky top-32 flex flex-col items-center md:items-start text-center md:text-left gap-4 hover-pause">
                        <button class="w-12 h-12 rounded-full glass-panel hover:bg-white/10 flex items-center justify-center text-white transition mb-2" onclick="ui.switchView('home')">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                        </button>
                        <div id="pl-view-art" class="w-64 h-64 md:w-full md:aspect-square rounded-2xl shadow-2xl flex items-center justify-center text-6xl font-bold text-white shadow-black/50 overflow-hidden">
                            <!-- Injected by JS -->
                        </div>
                        <div class="w-full flex flex-col min-w-0">
                            <div class="marquee-container mb-2 w-full"><h2 class="text-4xl font-bold text-white marquee-text font-bold" id="playlist-view-title">Name</h2></div>
                            <p class="text-gray-400 mb-6 text-sm" id="playlist-view-count">0 tracks</p>
                            <button id="playlist-play-all" class="bg-green-500 text-black px-8 py-3 rounded-full font-bold hover:scale-105 transition shadow-lg shadow-green-500/30 flex items-center justify-center gap-2 w-full max-w-xs mx-auto md:mx-0">
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play All
                            </button>
                        </div>
                    </div>
                </div>
                <div class="flex-1 min-w-0 md:pt-16">
                    <div id="playlist-songs-list" class="flex flex-col gap-3"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- PLAYER FOOTER STACK -->
    <div id="player-footer" class="fixed bottom-6 left-6 right-6 z-50 flex flex-col items-end pointer-events-none gap-2 translate-y-[150%] opacity-0 transition-all duration-700 ease-out">
        
        <!-- Queue Anchor -->
        <div class="relative w-72 md:w-80 flex-shrink-0 pointer-events-none h-0 z-[40]">
            <div id="queue-wrapper" class="absolute bottom-0 right-0 w-full flex flex-col z-[40]">
                
                <div id="queue-blur-bg" class="liquid-blur-fade"></div>

                <!-- Active Area containing Now Playing and Up Next Morph Slot -->
                <div id="player-active-area" class="order-1 w-full pointer-events-auto relative z-20">
                    <!-- 1. TOP ITEM: Current Song Info Island -->
                    <div id="info-island" class="glass-panel rounded-2xl p-2 pr-4 flex items-center shadow-2xl w-full border border-white/10 bg-[#121212]/90 transition-all duration-400 group hover-pause">
                        
                        <button class="w-0 opacity-0 overflow-hidden text-gray-400 hover:text-white transition-all duration-300 ease-in-out group-hover:w-8 group-hover:opacity-100 flex items-center justify-center flex-shrink-0 pl-1" id="btn-expand-queue" onclick="ui.toggleQueue()">
                            <svg class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
                        </button>

                        <div id="album-art-wrapper" class="relative w-12 h-12 flex-shrink-0 cursor-pointer rounded-xl overflow-hidden shadow-md ml-1" ondblclick="player.toggleLike()">
                            <div id="album-art-glow"></div>
                            <img id="curr-art-img" src="https://placehold.co/300/333/fff?text=Music" class="w-full h-full object-cover border border-white/20" crossorigin="anonymous">
                        </div>

                        <div class="flex-1 min-w-0 flex flex-col justify-center cursor-pointer ml-3" ondblclick="player.toggleLike()">
                            <div class="marquee-container w-full"><h3 id="p-title" class="font-bold text-white text-sm marquee-text">Not Playing</h3></div>
                            <div class="marquee-container w-full mt-0.5"><p id="p-artist" class="text-xs text-gray-400 marquee-text">Select song</p></div>
                        </div>
                        <button onclick="player.toggleLike(); event.stopPropagation();" id="p-like-btn" class="text-gray-400 hover:text-red-500 transition disabled:opacity-30 flex-shrink-0 ml-2" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                    </div>

                    <!-- Dedicated 10s Preview Slot for Morphing -->
                    <div id="queue-preview-slot" class="w-full pointer-events-none">
                        <div id="up-next-label" class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1 pl-2 drop-shadow-md transition-opacity duration-400">Up Next</div>
                        <div id="queue-preview-pill" class="glass-panel rounded-2xl p-2 pr-4 flex items-center shadow-2xl w-full border border-white/10 bg-[#121212]/90 transition-all duration-400"></div>
                    </div>
                </div>

                <!-- 2. BOTTOM ITEM: Expanding Lists Container -->
                <div id="queue-expandable-area" class="order-2">
                    <div id="queue-full-content">
                        <div id="queue-tabs" class="flex items-center gap-4 px-4 pt-4 pb-2 border-b border-white/5 flex-shrink-0 relative z-20">
                            <button class="text-xs font-bold uppercase tracking-wider text-white" id="tab-upnext" onclick="ui.switchQueueTab('upnext')">Up Next</button>
                            <button class="text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-gray-300" id="tab-history" onclick="ui.switchQueueTab('history')">History</button>
                        </div>
                        <div class="pt-2 pb-1 overflow-y-auto custom-scrollbar flex flex-col gap-1 flex-1 px-2" id="queue-list"></div>
                        <div class="pt-2 pb-1 overflow-y-auto custom-scrollbar flex flex-col gap-1 flex-1 px-2 hidden" id="history-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN PLAYER PILL -->
        <div class="w-full glass-panel rounded-2xl shadow-2xl p-2 px-4 flex items-center gap-4 h-[72px] pointer-events-auto relative z-[50]" id="player-card">
            <div class="flex items-center gap-3 flex-shrink-0">
                <button class="text-gray-400 hover:text-white disabled:opacity-30 transition" onclick="player.toggleShuffle()" id="btn-shuffle" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                </button>
                <button class="text-gray-300 hover:text-white disabled:opacity-30 flex-shrink-0" onclick="player.prev()" id="btn-prev" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                </button>
                <button onclick="player.togglePlay()" id="btn-play" class="w-12 h-12 bg-white rounded-full flex-shrink-0 flex items-center justify-center text-black hover:scale-105 transition shadow-lg shadow-white/20 disabled:bg-gray-500 disabled:scale-100 disabled:cursor-not-allowed mx-1" disabled>
                    <span id="icon-play" class="flex ml-1"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
                    <span id="icon-pause" class="hidden"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span>
                </button>
                <button class="text-gray-300 hover:text-white disabled:opacity-30 flex-shrink-0" onclick="player.next()" id="btn-next" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                </button>
                <button class="text-gray-400 hover:text-white disabled:opacity-30 transition" onclick="player.toggleRepeat()" id="btn-repeat" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
            </div>
            <div class="flex-1 h-full relative flex items-center group px-4 border-l border-white/10 ml-2">
                <div id="seek-bar-container" class="w-full h-[60px] disabled relative">
                    <div id="seek-tooltip">0:00</div>
                    <div id="seek-bar-track"></div>
                    <canvas id="visualizer-canvas"></canvas>
                    <input type="range" id="seek-bar" value="0" step="0.1" disabled>
                </div>
            </div>
            <div class="w-24 hidden md:block border-l border-white/10 pl-4 flex-shrink-0">
                <input type="range" min="0" max="1" step="0.05" oninput="player.setVolume(this.value)" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>
    </div>

    <audio id="audio-el" crossorigin="anonymous" class="hidden"></audio>

    <script>
        // ============================================
        // UTILS & JS MARQUEE ENGINE
        // ============================================
        const utils = {
            decodeHtml: (html) => {
                if(!html) return '';
                const txt = document.createElement("textarea"); txt.innerHTML = html; return txt.value;
            },
            escapeHtml: (text) => text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : ''
        };

        const updateMarquees = () => {
            document.querySelectorAll('.marquee-container').forEach(container => {
                if(container.offsetParent === null) return;
                const text = container.querySelector('.marquee-text');
                if(!text) return;
                
                if(text.classList.contains('is-overflowing') && text.dataset.scrollWidth === String(text.scrollWidth)) return;

                text.style.animation = 'none'; text.classList.remove('is-overflowing'); container.classList.remove('is-overflowing');
                
                if (text.scrollWidth > container.clientWidth + 2) {
                    const dist = text.scrollWidth - container.clientWidth;
                    const dur = Math.max(3, dist / 15);
                    text.style.setProperty('--scroll-dist', `-${dist}px`);
                    text.style.setProperty('--scroll-dur', `${dur}s`);
                    text.dataset.scrollWidth = text.scrollWidth;
                    
                    void text.offsetWidth; // Trigger reflow
                    text.style.animation = ''; text.classList.add('is-overflowing'); container.classList.add('is-overflowing');
                }
            });
        };

        // ============================================
        // JIOSAAVN API CORE
        // ============================================
        const JIOSAAVN_API_ENDPOINTS = ['https://jiosaavn-api-taupe-phi.vercel.app/api', 'https://jiosaavn-api-v2.vercel.app/api', 'https://saavn.me/api', 'https://jio-saavn-api-red.vercel.app/api'];
        let currentApiIndex = 0; let JIOSAAVN_API = JIOSAAVN_API_ENDPOINTS[currentApiIndex];
        function switchToNextApi() { currentApiIndex = (currentApiIndex + 1) % JIOSAAVN_API_ENDPOINTS.length; JIOSAAVN_API = JIOSAAVN_API_ENDPOINTS[currentApiIndex]; return currentApiIndex !== 0; }

        const jiosaavnAPI = {
            fetchWithRetry: async (url, retries = 3) => {
                let apiSwitchAttempts = JIOSAAVN_API_ENDPOINTS.length;
                while (apiSwitchAttempts > 0) {
                    for (let i = 0; i < retries; i++) {
                        try {
                            const currentUrl = url.replace(/https:\/\/[^\/]+\/api/, JIOSAAVN_API);
                            const response = await fetch(currentUrl);
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            const data = await response.json();
                            if (data.success === false) throw new Error(data.message);
                            return data;
                        } catch (error) {
                            if (i === retries - 1) { if (switchToNextApi()) { apiSwitchAttempts--; break; } }
                            if (i === retries - 1) throw error; await new Promise(r => setTimeout(r, 1000));
                        }
                    }
                    if (apiSwitchAttempts > 0 && apiSwitchAttempts < JIOSAAVN_API_ENDPOINTS.length) continue; break;
                }
            },
            searchSongs: async (query, limit = 20) => {
                try {
                    const data = await jiosaavnAPI.fetchWithRetry(`${JIOSAAVN_API}/search/songs?query=${encodeURIComponent(query)}&limit=${limit}`);
                    return (data.data?.results || []).map(jiosaavnAPI.normalizeSong).filter(Boolean);
                } catch (e) { return []; }
            },
            searchAlbums: async (query) => {
                try {
                    const res = await jiosaavnAPI.fetchWithRetry(`${JIOSAAVN_API}/search/albums?query=${encodeURIComponent(query)}&limit=8`);
                    return (res.data?.results || []).map(a => ({
                        id: a.id, name: utils.decodeHtml(a.title || a.name || 'Unknown'), artist: utils.decodeHtml(a.description || a.music || 'Album'),
                        img: a.image?.[2]?.url || a.image?.[1]?.url || a.image?.[0]?.url || 'https://placehold.co/300', type: 'album'
                    }));
                } catch(e) { return []; }
            },
            searchArtists: async (query) => {
                try {
                    const res = await jiosaavnAPI.fetchWithRetry(`${JIOSAAVN_API}/search/artists?query=${encodeURIComponent(query)}&limit=8`);
                    return (res.data?.results || []).map(a => ({
                        id: a.id, name: utils.decodeHtml(a.title || a.name || 'Unknown'), artist: utils.decodeHtml(a.description || a.role || 'Artist'),
                        img: a.image?.[2]?.url || a.image?.[1]?.url || a.image?.[0]?.url || 'https://placehold.co/300', type: 'artist'
                    }));
                } catch(e) { return []; }
            },
            searchAll: async (query) => {
                try {
                    const [songs, albums, artists] = await Promise.all([ jiosaavnAPI.searchSongs(query, 6), jiosaavnAPI.searchAlbums(query), jiosaavnAPI.searchArtists(query) ]);
                    if(songs.length === 0) return { top: null, songs: [], albums: [], artists: [] };
                    return { top: songs[0], songs: songs.slice(1, 6), albums, artists };
                } catch(e) { return { top: null, songs: [], albums: [], artists: [] }; }
            },
            getTrending: async () => {
                try {
                    const data = await jiosaavnAPI.fetchWithRetry(`${JIOSAAVN_API}/playlists?id=110858205`);
                    if (data.data?.songs) return data.data.songs.map(jiosaavnAPI.normalizeSong); return [];
                } catch (e) { return jiosaavnAPI.searchSongs('trending hindi', 16); }
            },
            getSong: async (id) => {
                try {
                    const data = await jiosaavnAPI.fetchWithRetry(`${JIOSAAVN_API}/songs/${id}`);
                    if (data.data && data.data.length > 0) return jiosaavnAPI.normalizeSong(data.data[0]); return null;
                } catch (e) { return null; }
            },
            getAlbum: async (id) => {
                try {
                    const data = await jiosaavnAPI.fetchWithRetry(`${JIOSAAVN_API}/albums?id=${id}`);
                    if (data.data) {
                        return {
                            id: data.data.id, name: utils.decodeHtml(data.data.name || data.data.title),
                            img: data.data.image?.[2]?.url || data.data.image?.[1]?.url || 'https://placehold.co/300',
                            songs: (data.data.songs || []).map(jiosaavnAPI.normalizeSong).filter(Boolean)
                        };
                    }
                    return null;
                } catch(e) { return null; }
            },
            normalizeSong: (song) => {
                if (!song) return null; let bestUrl = null; const dUrls = song.downloadUrl || [];
                for (let i = dUrls.length - 1; i >= 0; i--) { if (dUrls[i]?.url) { bestUrl = dUrls[i].url; break; } }
                const rawName = song.name || song.title || 'Unknown';
                const rawArtist = song.artists?.primary?.map(a => a.name).join(', ') || song.primaryArtists || 'Unknown Artist';
                return {
                    id: song.id, name: utils.decodeHtml(rawName), artist: utils.decodeHtml(rawArtist),
                    img: song.image?.[2]?.url || song.image?.[1]?.url || 'https://placehold.co/300/333/fff?text=Music',
                    url: bestUrl, duration: song.duration || 0, source: 'jiosaavn'
                };
            },
            isStreamingUrl: (url) => url && (url.includes('.mp3') || url.includes('.m4a') || url.includes('.aac'))
        };

        // ============================================
        // STATE & PERSISTENCE
        // ============================================
        const state = { 
            queue: [], userQueue: [], idx: -1, playing: false, loaded: false, shuffle: false, repeat: 0, currentTrack: null,
            likedIds: JSON.parse(localStorage.getItem('likedIds') || '[]'),
            playHistory: JSON.parse(localStorage.getItem('playHistory') || '[]'),
            artistPlayCounts: JSON.parse(localStorage.getItem('artistPlayCounts') || '{}'),
            playlists: JSON.parse(localStorage.getItem('playlists') || '{}'),
            searchDebounce: null, hoverProgress: -1, lastHoverProgress: 0.5, isDragging: false, 
            upNextTriggered: false, queueExpanded: false, activeQueueTab: 'upnext'
        };

        const songStore = {
            songs: new Map(), counter: 0,
            add: (song) => { const id = `song_${songStore.counter++}`; songStore.songs.set(id, song); return id; },
            get: (id) => songStore.songs.get(id)
        };

        const persist = {
            save: () => {
                if(!state.currentTrack) return;
                const data = { track: state.currentTrack, q: state.queue, uq: state.userQueue, idx: state.idx, time: audio.currentTime };
                localStorage.setItem('playbackState', JSON.stringify(data));
            },
            load: () => {
                try {
                    const data = JSON.parse(localStorage.getItem('playbackState'));
                    if(data && data.track) {
                        state.currentTrack = data.track; state.queue = data.q || []; state.userQueue = data.uq || []; state.idx = data.idx || 0;
                        state.loaded = true;
                        
                        document.getElementById('player-footer').classList.remove('translate-y-[150%]', 'opacity-0');
                        ui.enableControls(); ui.updateMetadata(state.currentTrack); ui.renderQueue(); ui.renderHistory();
                        
                        audio.src = state.currentTrack.url;
                        audio.addEventListener('loadedmetadata', function onMetaLoad() {
                            audio.currentTime = data.time || 0; currentProgress = audio.duration ? audio.currentTime / audio.duration : 0;
                            document.getElementById('seek-bar').value = data.time || 0; audio.removeEventListener('loadedmetadata', onMetaLoad);
                        });
                    }
                } catch(e) {}
            }
        };

        // ============================================
        // CONTEXT MENU LOGIC
        // ============================================
        const ctxMenu = {
            activeStoreId: null, activePlaylistName: null,
            init: () => {
                const menu = document.getElementById('context-menu');
                document.addEventListener('click', () => { menu.classList.add('hidden'); });
                document.getElementById('cm-play-next').onclick = () => { const s = songStore.get(ctxMenu.activeStoreId); if(s) player.addNext(s); };
                document.getElementById('cm-add-queue').onclick = () => { const s = songStore.get(ctxMenu.activeStoreId); if(s) player.addToQueue(s); };
                document.getElementById('cm-add-playlist').onclick = (e) => { e.stopPropagation(); menu.classList.add('hidden'); ctxMenu.showPlaylistSelector(); };
                document.getElementById('cm-pl-play').onclick = () => { ui.playPlaylist(ctxMenu.activePlaylistName); };
                document.getElementById('cm-pl-delete').onclick = () => { ui.deletePlaylist(ctxMenu.activePlaylistName); };
            },
            showSong: (event, storeId) => {
                ctxMenu.activeStoreId = storeId; const menu = document.getElementById('context-menu'); 
                document.getElementById('cm-song-options').classList.remove('hidden'); document.getElementById('cm-playlist-options').classList.add('hidden');
                menu.classList.remove('hidden'); const x = Math.min(event.clientX, window.innerWidth - 200); const y = Math.min(event.clientY, window.innerHeight - 150);
                menu.style.left = `${x}px`; menu.style.top = `${y}px`;
            },
            showPlaylist: (event, playlistName) => {
                ctxMenu.activePlaylistName = playlistName; const menu = document.getElementById('context-menu');
                document.getElementById('cm-song-options').classList.add('hidden'); document.getElementById('cm-playlist-options').classList.remove('hidden');
                menu.classList.remove('hidden'); const x = Math.min(event.clientX, window.innerWidth - 200); const y = Math.min(event.clientY, window.innerHeight - 150);
                menu.style.left = `${x}px`; menu.style.top = `${y}px`;
            },
            showPlaylistSelector: () => {
                const song = songStore.get(ctxMenu.activeStoreId); if(!song) return;
                const modal = document.getElementById('playlist-selector-modal'); const list = document.getElementById('playlist-selector-list');
                let html = '';
                Object.keys(state.playlists).forEach(name => {
                    html += `<button class="w-full text-left px-4 py-3 glass-panel rounded-lg hover:bg-white/10 text-white transition" onclick="ui.addSongToPlaylist('${utils.escapeHtml(name)}')">${utils.escapeHtml(name)}</button>`;
                });
                if(Object.keys(state.playlists).length === 0) html = '<p class="text-gray-400 text-sm py-2">No playlists created yet.</p>';
                list.innerHTML = html; modal.classList.remove('hidden');
            }
        };

        // ============================================
        // PLAYER LOGIC & MEDIA SESSION
        // ============================================
        const audio = document.getElementById('audio-el');
        let isPlaybackPending = false;

        window.playSongById = (storeId) => {
            const song = songStore.get(storeId);
            if (song) { player.playDirect(song); } // Just interrupt current, leave forward queue intact
        };

        window.playContext = async (type, id) => {
            try {
                const data = await jiosaavnAPI.fetchWithRetry(`${JIOSAAVN_API}/${type}s?id=${id}`);
                let songs = [];
                if(type === 'album') songs = (data.data?.songs || []).map(jiosaavnAPI.normalizeSong).filter(Boolean);
                else if (type === 'artist') songs = (data.data?.topSongs || data.data?.songs || []).map(jiosaavnAPI.normalizeSong).filter(Boolean);
                
                if (songs.length > 0) { state.queue = songs; state.userQueue = []; state.idx = 0; player.playDirect(songs[0]); }
            } catch(e) {}
        };

        const player = {
            playDirect: async (track) => {
                if (!track || isPlaybackPending) return;
                isPlaybackPending = true;
                
                state.upNextTriggered = false; 
                document.getElementById('queue-wrapper').classList.remove('preview-expanded', 'track-swap-out');
                
                try {
                    let playUrl = track.url;
                    if (!jiosaavnAPI.isStreamingUrl(playUrl)) {
                        const songDetails = await jiosaavnAPI.getSong(track.id);
                        if (songDetails && songDetails.url) playUrl = songDetails.url;
                    }
                    if (!playUrl) throw new Error('No URL');
                    
                    audio.src = playUrl; state.currentTrack = track; state.loaded = true; 
                    
                    document.getElementById('player-footer').classList.remove('translate-y-[150%]', 'opacity-0');
                    ui.enableControls(); await audio.play(); 
                    
                    if (audioContext && audioContext.state === 'suspended') audioContext.resume();
                    if (!isAudioContextInitialized) setupAudioContext();
                    
                    ui.updateMetadata(track); ui.renderQueue(); 
                    
                    state.playHistory = state.playHistory.filter(t => t.id !== track.id);
                    state.playHistory.unshift(track);
                    if(state.playHistory.length > 100) state.playHistory.pop();
                    localStorage.setItem('playHistory', JSON.stringify(state.playHistory));
                    
                    ui.renderHistory();
                    if(!document.getElementById('view-home').classList.contains('hidden')) homeView.renderRecentlyPlayed();
                    
                    persist.save();
                } catch (error) { state.playing = false; ui.updatePlayBtn(); } 
                finally { isPlaybackPending = false; }
            },
            togglePlay: () => {
                if(!state.loaded) return;
                if(state.playing) { audio.pause(); } else { audio.play(); if (!isAudioContextInitialized) setupAudioContext(); }
            },
            next: () => { 
                if (state.userQueue.length > 0) { const nextSong = state.userQueue.shift(); player.playDirect(nextSong); } 
                else if (state.queue.length > 0) {
                    let nextIdx = state.shuffle ? Math.floor(Math.random() * state.queue.length) : (state.idx + 1) % state.queue.length;
                    state.idx = nextIdx; player.playDirect(state.queue[nextIdx]);
                }
            },
            prev: () => { 
                if(state.queue.length === 0) return;
                let prevIdx = state.idx - 1; if(prevIdx < 0) prevIdx = state.queue.length - 1;
                state.idx = prevIdx; player.playDirect(state.queue[prevIdx]);
            },
            setVolume: (val) => { audio.volume = Math.max(0, Math.min(1, val)); },
            toggleShuffle: () => { state.shuffle = !state.shuffle; const btn = document.getElementById('btn-shuffle'); state.shuffle ? btn.classList.add('active-state') : btn.classList.remove('active-state'); ui.renderQueue(); persist.save(); },
            toggleRepeat: () => { state.repeat = (state.repeat + 1) % 3; const btn = document.getElementById('btn-repeat'); state.repeat === 0 ? btn.classList.remove('active-state') : btn.classList.add('active-state'); audio.loop = (state.repeat === 2); },
            likeSong: (songId = null) => {
                if(!songId) { if(!state.currentTrack) return; songId = state.currentTrack.id; }
                const idx = state.likedIds.indexOf(songId);
                if(idx === -1) state.likedIds.push(songId); else state.likedIds.splice(idx, 1);
                localStorage.setItem('likedIds', JSON.stringify(state.likedIds));
                if(state.currentTrack && state.currentTrack.id === songId) ui.updateMetadata(state.currentTrack); 
                ui.renderPlaylists(); 
                if (!document.getElementById('view-playlist').classList.contains('hidden') && document.getElementById('playlist-view-title').textContent === 'Liked Songs') { ui.openPlaylist('Liked Songs'); }
            },
            toggleLike: () => { player.likeSong(); },
            addNext: (song) => { state.userQueue.unshift(song); ui.renderQueue(); persist.save(); },
            addToQueue: (song) => { state.userQueue.push(song); ui.renderQueue(); persist.save(); }
        };

        audio.addEventListener('play', () => { 
            state.playing = true; ui.updatePlayBtn(); persist.save();

                const seekTrack = document.getElementById('seek-bar-track');

                    html += upcoming.map(song => ui.createSongPill(song, `playSongById('${songStore.add(song)}')`)).join('');
                }
                listEl.innerHTML = html === '' ? '<div class="text-xs text-gray-500 p-2">Queue is empty</div>' : html;
                updateMarquees();
            },
            renderHistory: () => {
                const histEl = document.getElementById('history-list');
                if(state.playHistory.length <= 1) {
                    histEl.innerHTML = '<div class="text-xs text-gray-500 p-2">No history yet</div>'; return;
                }
                histEl.innerHTML = state.playHistory.slice(1).map(song => ui.createSongPill(song, `playSongById('${songStore.add(song)}')`)).join('');
                updateMarquees();
            }
        };

        // ============================================
        // SEARCH VIEW MANAGER
        // ============================================
        let lastFullSearch = '';
        const searchManager = {
            init: () => {
                const input = document.getElementById('search-input'); 
                const dropWrapper = document.getElementById('search-dropdown');
                const results = document.getElementById('search-results');
                
                input.addEventListener('focus', () => { 
                    const q = input.value.trim();
                    if (q.length >= 2 && q !== lastFullSearch && results.innerHTML !== '') dropWrapper.classList.add('active'); 
                });
                
                input.addEventListener('blur', () => { setTimeout(() => { dropWrapper.classList.remove('active'); }, 200); });
                
                input.addEventListener('input', (e) => {
                    clearTimeout(state.searchDebounce); const query = e.target.value.trim();
                    if (query.length < 2 || query === lastFullSearch) { dropWrapper.classList.remove('active'); results.innerHTML = ''; return; }
                    
                    state.searchDebounce = setTimeout(async () => {
                        results.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">Searching...</div>'; 
                        dropWrapper.classList.add('active');
                        
                        const songs = await jiosaavnAPI.searchSongs(query, 4); 
                        if(songs.length === 0) { dropWrapper.classList.remove('active'); results.innerHTML = ''; return; }
                        
                        results.innerHTML = '<div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1 pl-2 drop-shadow-md">Songs</div>' + songs.map(song => {
                            const storeId = songStore.add(song);
                            return ui.createSongPill(song, `playSongById('${storeId}'); document.getElementById('search-dropdown').classList.remove('active');`, 'quicksearch');
                        }).join('');
                        updateMarquees();
                    }, 400);
                });
                
                input.addEventListener('keydown', (e) => {
                    if(e.key === 'Enter') {
                        e.preventDefault(); const query = e.target.value.trim();
                        if(query.length > 0) { 
                            lastFullSearch = query; 
                            dropWrapper.classList.remove('active'); results.innerHTML = ''; 
                            searchManager.performFullSearch(query); 
                        }
                    }
                });
            },
            performFullSearch: async (query) => {
                ui.switchView('search'); document.getElementById('search-title').textContent = `Results for "${query}"`;
                document.getElementById('search-content').classList.add('hidden'); document.getElementById('search-loading').classList.remove('hidden');

                const data = await jiosaavnAPI.searchAll(query);
                document.getElementById('search-loading').classList.add('hidden'); document.getElementById('search-content').classList.remove('hidden');
                if(!data.top) { document.getElementById('search-content').innerHTML = '<p class="text-gray-400 pl-8">No results found.</p>'; return; }

                const topStoreId = songStore.add(data.top);
                document.getElementById('search-top-result').innerHTML = `
                    <div class="absolute inset-0 z-0" ondblclick="player.likeSong('${data.top.id}')">
                        <img src="${data.top.img}" class="w-full h-full object-cover opacity-20 blur-sm">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-transparent"></div>
                    </div>
                    <div class="relative z-10 flex flex-col justify-end h-full">
                        <img src="${data.top.img}" class="w-32 h-32 md:w-40 md:h-40 rounded-lg shadow-2xl mb-4 border border-white/10 object-cover" ondblclick="player.likeSong('${data.top.id}')">
                        
                        <div class="flex items-start justify-between gap-4">
                            <div class="flex-1 min-w-0" ondblclick="player.likeSong('${data.top.id}')">
                                <h2 class="text-3xl font-bold text-white mb-2 line-clamp-2" title="${utils.escapeHtml(data.top.name)}">${utils.escapeHtml(data.top.name)}</h2>
                                <div class="flex items-center gap-2 text-gray-300 text-sm mb-4">
                                    <span class="bg-white/10 px-2 py-0.5 rounded text-xs font-semibold">SONG</span>
                                    <div class="marquee-container w-full ml-2"><span class="marquee-text">${utils.escapeHtml(data.top.artist)}</span></div>
                                </div>
                            </div>
                            <button class="p-2 bg-black/60 backdrop-blur-md rounded-full text-white hover:bg-white/20 transition flex-shrink-0 shadow-lg" onclick="event.stopPropagation(); ctxMenu.showSong(event, '${topStoreId}')">
                                <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
                            </button>
                        </div>

                        <div class="flex items-center gap-3">
                            <button onclick="playSongById('${topStoreId}')" class="bg-green-500 text-black px-6 py-2 rounded-full font-bold hover:scale-105 transition shadow-lg shadow-green-500/30 flex items-center gap-2">
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play
                            </button>
                        </div>
                    </div>
                `;
                document.getElementById('search-songs-list').innerHTML = data.songs.map(song => ui.createListRow(song)).join('');
                document.getElementById('search-albums-grid').innerHTML = data.albums.map(item => ui.createCard(item)).join('');
                document.getElementById('search-artists-grid').innerHTML = data.artists.map(item => ui.createCard(item)).join('');
                updateMarquees();
            }
        };

        const homeView = {
            init: async () => {
                ui.renderPlaylists(); 
                const isNewUser = state.playHistory.length === 0;
                if (isNewUser) {
                    document.getElementById('section-trending').classList.remove('hidden');
                    const grid = document.getElementById('trending-grid');
                    grid.innerHTML = Array(16).fill('<div class="scroll-card h-[200px] rounded-xl glass-panel animate-pulse w-40 flex-shrink-0"></div>').join('');
                    const trendingSongs = await jiosaavnAPI.getTrending();
                    grid.innerHTML = trendingSongs.slice(0, 16).map(song => ui.createCard(song)).join('');
                } else {
                    document.getElementById('section-quick-picks').classList.remove('hidden');
                    document.getElementById('section-recent').classList.remove('hidden');
                    homeView.renderRecentlyPlayed(); homeView.generateQuickPicks();
                }
                updateMarquees();
            },
            renderRecentlyPlayed: () => {
                const grid = document.getElementById('recent-grid'); if(!grid) return;
                if(state.playHistory.length === 0) { grid.innerHTML = '<p class="text-gray-500 pl-8">Play some songs to see them here.</p>'; return; }
                grid.innerHTML = state.playHistory.map(song => ui.createCard(song)).join('');
                updateMarquees();
            },
            generateQuickPicks: async () => {
                const grid = document.getElementById('quick-picks-grid');
                grid.innerHTML = Array(16).fill('<div class="scroll-card h-[200px] rounded-xl glass-panel animate-pulse w-40 flex-shrink-0"></div>').join('');
                try {
                    const trending = await jiosaavnAPI.getTrending(); let picks = [...trending.slice(0, 6)]; 
                    const artists = Object.keys(state.artistPlayCounts).sort((a,b) => state.artistPlayCounts[b] - state.artistPlayCounts[a]).slice(0, 2);
                    for(const artist of artists) { const artistSongs = await jiosaavnAPI.searchSongs(artist, 5); picks = [...picks, ...artistSongs]; }
                    const uniquePicks = []; const seenIds = new Set();
                    for(const song of picks) { if(song && !seenIds.has(song.id)) { uniquePicks.push(song); seenIds.add(song.id); } }
                    uniquePicks.sort(() => Math.random() - 0.5); const finalPicks = uniquePicks.slice(0, 16);
                    grid.innerHTML = finalPicks.map(song => ui.createCard(song)).join('');
                    updateMarquees();
                } catch(e) { grid.innerHTML = '<p class="text-red-400 pl-8">Could not load Quick Picks.</p>'; }
            }
        };

        function initApp() {
            const vCanvas = document.getElementById('visualizer-canvas'); visualizerCtx = vCanvas.getContext('2d');
            function resizeCanvas() {
                const container = document.getElementById('seek-bar-container'); const dpr = Math.min(window.devicePixelRatio || 1, 2);
                vCanvas.width = container.offsetWidth * dpr; vCanvas.height = container.offsetHeight * dpr; visualizerCtx.scale(dpr, dpr);
            }
            resizeCanvas(); window.addEventListener('resize', resizeCanvas);

            const seekBar = document.getElementById('seek-bar'); const container = document.getElementById('seek-bar-container'); const tooltip = document.getElementById('seek-tooltip');
            seekBar.addEventListener('mousedown', () => state.isDragging = true); seekBar.addEventListener('mouseup', () => { state.isDragging = false; persist.save(); });
            seekBar.addEventListener('input', () => { if(audio.duration) { audio.currentTime = parseFloat(seekBar.value); currentProgress = audio.currentTime / audio.duration; } });

            container.addEventListener('mousemove', (e) => {
                if(!state.loaded || !audio.duration) return; const rect = container.getBoundingClientRect();
                if (e.clientY - rect.top < rect.height / 2) { state.hoverProgress = -1; tooltip.classList.remove('visible'); return; }
                const progress = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)); state.hoverProgress = progress; state.lastHoverProgress = progress;
                const hoverTime = progress * audio.duration; tooltip.textContent = `${Math.floor(hoverTime / 60)}:${Math.floor(hoverTime % 60).toString().padStart(2, '0')}`;
                tooltip.style.left = `${(e.clientX - rect.left)}px`; tooltip.classList.add('visible');
            });
            container.addEventListener('mouseleave', () => { state.hoverProgress = -1; tooltip.classList.remove('visible'); });

            audio.addEventListener('timeupdate', () => {
                if(audio.duration && !state.isDragging) {
                    seekBar.max = audio.duration; seekBar.value = audio.currentTime;
                    currentProgress = audio.currentTime / audio.duration;

                    if(Math.floor(audio.currentTime) % 5 === 0) persist.save();

                    // Morphing 10s Preview Logic 
                    const timeRemaining = audio.duration - audio.currentTime;
                    const hasNext = state.userQueue.length > 0 || (state.queue.length > 0 && state.idx < state.queue.length - 1);
                    const wrap = document.getElementById('queue-wrapper');
                    
                    if (timeRemaining <= 10 && timeRemaining > 0 && hasNext) {
                        if (!state.upNextTriggered && !state.queueExpanded) {
                            state.upNextTriggered = true;
                            let nextTrack = state.userQueue.length > 0 ? state.userQueue[0] : (state.shuffle ? state.queue.filter((_, i) => i !== state.idx)[0] : state.queue[state.idx + 1]);
                            if (nextTrack) {
                                document.getElementById('queue-preview-pill').innerHTML = ui.createSongPillInner(nextTrack);
                                document.getElementById('queue-preview-pill').className = "glass-panel rounded-2xl p-2 pr-4 flex items-center shadow-2xl w-full border border-white/10 bg-[#121212]/90";
                                wrap.classList.add('preview-expanded');
                                updateMarquees();
                            }
                        }
                    } else if (state.upNextTriggered && timeRemaining > 10) {
                        state.upNextTriggered = false;
                        wrap.classList.remove('preview-expanded');
                    }
                }
            });
            
            // Seamless Swap Out Track Animation
            audio.addEventListener('ended', () => {
                const wrap = document.getElementById('queue-wrapper');
                if(state.upNextTriggered && !state.queueExpanded) {
                    wrap.classList.add('track-swap-out');
                    setTimeout(() => {
                        wrap.classList.remove('preview-expanded', 'track-swap-out');
                        if(state.repeat === 2) { audio.currentTime = 0; audio.play(); state.upNextTriggered = false; } else player.next();
                    }, 400); // Wait for CSS swap out morph
                } else {
                    wrap.classList.remove('preview-expanded', 'track-swap-out');
                    if(state.repeat === 2) { audio.currentTime = 0; audio.play(); state.upNextTriggered = false; } else player.next();
                }
            });

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                switch(e.key.toLowerCase()) {
                    case ' ': e.preventDefault(); player.togglePlay(); break;
                    case 'arrowleft':
                    case 'a': player.prev(); break;
                    case 'arrowright':
                    case 'd': player.next(); break;
                    case 'q': ui.toggleQueue(); break;
                    case 'e': 
                    case '/': e.preventDefault(); document.getElementById('search-input').focus(); break;
                    case 'w': player.setVolume(audio.volume + 0.1); break;
                    case 's': player.setVolume(audio.volume - 0.1); break;
                }
            });

            ctxMenu.init(); searchManager.init(); persist.load(); homeView.init(); requestAnimationFrame(viz.render);
            
            window.addEventListener('resize', () => { updateMarquees(); });
        }

        initApp();
    </script>
</body>
</html>
