name: Quick Test Render (4K)

on:
  workflow_dispatch:
    inputs:
      song_query:
        description: Song query (used only when song_id is empty)
        required: false
        default: Aaj Ki Raat
        type: string
      song_id:
        description: Optional direct JioSaavn song ID
        required: false
        default: ''
        type: string
      render_preset:
        description: Render preset
        required: false
        default: 4k-logo
        type: choice
        options:
          - 4k-logo
          - 4k-clean
      max_seconds:
        description: Clip duration cap in seconds (0 renders full song)
        required: false
        default: '0'
        type: string

jobs:
  render-test-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare folders
        run: mkdir -p data output

      - name: Build test lyrics input
        env:
          SONG_QUERY: ${{ inputs.song_query }}
          SONG_ID: ${{ inputs.song_id }}
        run: |
          set -e
          if [ -n "$SONG_ID" ]; then
            npm run phase3:build -- --song-id="$SONG_ID" --out=data/test-lyrics.json
          else
            npm run phase3:build -- --query="$SONG_QUERY" --out=data/test-lyrics.json
          fi

      - name: Render test video (4K)
        env:
          RENDER_PRESET: ${{ inputs.render_preset }}
          PHASE5_MAX_SECONDS: ${{ inputs.max_seconds }}
          PHASE5_RENDER_CONCURRENCY: 2
          PHASE5_RENDER_CRF: 24
        run: |
          set -e
          echo "[test-render] Render preset: $RENDER_PRESET"

          if [ "$RENDER_PRESET" = "4k-clean" ]; then
            npm run phase5:render:4k -- --lyrics=data/test-lyrics.json --out=output/test-video.mp4 --max-seconds="$PHASE5_MAX_SECONDS"
          else
            npm run phase5:render:4k:logo -- --lyrics=data/test-lyrics.json --out=output/test-video.mp4 --max-seconds="$PHASE5_MAX_SECONDS"
          fi

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-test-video
          path: output/test-video.mp4
          if-no-files-found: error
