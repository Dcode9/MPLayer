name: Fix phase3 match + render env

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore phase3 if broken then patch scoring
        run: |
          set -euo pipefail
          # Restore from known good if placeholder
          if ! grep -q 'scoreSongForQuery' scripts/phase3-build.js 2>/dev/null; then
            echo "Restoring phase3-build.js from good commit"
            git show 3c78e595f8cc0b97d2d13e2d3f97f2b926d38a20:scripts/phase3-build.js > scripts/phase3-build.js || \
            git show d57e5b1db55135cf2685abc210ec43f0af6f2418:scripts/phase3-build.js > scripts/phase3-build.js || \
            git show 1fc37a64a976a7faab324e3328f6ff9bcf92c0a6:scripts/phase3-build.js > scripts/phase3-build.js
          fi
          # Also try parent of placeholder commit
          if grep -q 'PLACEHOLDER' scripts/phase3-build.js; then
            git show 3c78e595f8cc0b97d2d13e2d3f97f2b926d38a20:scripts/phase3-build.js > scripts/phase3-build.js
          fi

          python3 << 'PY'
          from pathlib import Path
          path = Path('scripts/phase3-build.js')
          t = path.read_text()
          if 'PLACEHOLDER' in t or 'scoreSongForQuery' not in t:
              raise SystemExit('phase3 still broken')

          # Inject stricter scoring by replacing return score; block end markers is fragile.
          # Replace the whole function via regex between const scoreSongForQuery and const parseJsonFromText
          import re
          pattern = r'const scoreSongForQuery = \(song, query\) => \{[\s\S]*?\n\};\n\nconst parseJsonFromText'
          replacement = r'''const scoreSongForQuery = (song, query) => {
  const normalizedQuery = normalizeSearchText(query);
  if (!normalizedQuery) {
    return 0;
  }

  const songName = normalizeSearchText(song?.name || '');
  const artistName = normalizeSearchText(song?.artist || '');
  const albumName = normalizeSearchText(song?.album || '');
  const haystack = `${songName} ${artistName}`.trim();
  const queryTokens = normalizedQuery.split(/\s+/).filter(Boolean);
  const titleTokens = songName.split(/\s+/).filter(Boolean);
  const primaryToken = queryTokens[0] || '';

  let score = 0;

  if (songName === normalizedQuery) {
    score += 500;
  } else if (titleTokens.join(' ') === queryTokens.slice(0, titleTokens.length).join(' ')) {
    score += 420;
  } else if (primaryToken && songName === primaryToken) {
    score += 400;
  } else if (primaryToken && titleTokens[0] === primaryToken && titleTokens.length <= queryTokens.length + 1) {
    score += 320;
  }

  if (haystack === normalizedQuery) {
    score += 80;
  }

  if (songName.startsWith(normalizedQuery) || (primaryToken && songName.startsWith(primaryToken))) {
    score += 50;
  }

  if (songName.includes(normalizedQuery)) {
    score += 36;
  }

  for (const token of queryTokens) {
    if (titleTokens.includes(token)) {
      score += 22;
    } else if (songName.includes(token)) {
      score += 10;
    }
    if (artistName.includes(token)) {
      score += 4;
    }
  }

  if (primaryToken && primaryToken.length >= 4 && !songName.includes(primaryToken) && !titleTokens.includes(primaryToken)) {
    if (albumName.includes(primaryToken)) {
      score -= 200;
    } else {
      score -= 120;
    }
  }

  const versionHints = ['dhun', 'theme', 'instrumental', 'karaoke', 'bgm', 'score', 'ost', 'reprise'];
  if (versionHints.some((h) => titleTokens.includes(h)) && primaryToken && !versionHints.includes(primaryToken)) {
    score -= 150;
  }

  if (queryTokens.length === 1 && queryTokens[0].length <= 4 && titleTokens.includes(queryTokens[0])) {
    score += 35;
  }

  if (queryTokens.length <= 2 && titleTokens.length > queryTokens.length + 2) {
    score -= 25;
  }

  return score;
};

const parseJsonFromText'''

          new_t, n = re.subn(pattern, replacement, t, count=1)
          if n != 1:
              raise SystemExit(f'scoreSongForQuery replace failed count={n}')
          new_t = new_t.replace('best.score < 35', 'best.score < 80')
          new_t = new_t.replace('topScore < 15', 'topScore < 50')
          path.write_text(new_t)
          print('phase3 scoring OK', path.stat().st_size)
          PY

      - name: Patch phase7 render env + audio samples
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          wf = Path('.github/workflows/phase7-youtube-upload.yml')
          w = wf.read_text()
          w = w.replace('PHASE5_RENDER_CONCURRENCY: 2', 'PHASE5_RENDER_CONCURRENCY: 4')
          w = w.replace('PHASE5_RENDER_CRF: 20', 'PHASE5_RENDER_CRF: 23')
          if 'PHASE5_X264_PRESET' not in w:
              w = w.replace('PHASE5_RENDER_CRF: 23', 'PHASE5_RENDER_CRF: 23\n          PHASE5_X264_PRESET: veryfast')
          wf.write_text(w)
          print('workflow env OK')

          rem = Path('remotion/LyricsTemplateVideo.jsx')
          r = rem.read_text()
          r = r.replace('numberOfSamples: 128', 'numberOfSamples: 64')
          r = r.replace('return new Array(128).fill(0);', 'return new Array(64).fill(0);')
          rem.write_text(r)
          print('audio samples OK')
          PY

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/phase3-build.js remotion/LyricsTemplateVideo.jsx .github/workflows/phase7-youtube-upload.yml
          if git diff --cached --quiet; then
            echo No changes
            exit 0
          fi
          git commit -m "fix(phase3): exact title match; perf: CI concurrency 4, CRF 23, lighter audio viz"
          git push origin HEAD:main
