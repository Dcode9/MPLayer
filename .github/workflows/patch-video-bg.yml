name: Patch Remotion near-black background

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore phase3 from raw GitHub
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/Dcode9/MPLayer/1fc37a64a976a7faab324e3328f6ff9bcf92c0a6/scripts/phase3-build.js" -o scripts/phase3-build.js
          wc -c scripts/phase3-build.js
          grep -q scoreSongForQuery scripts/phase3-build.js

      - name: Commit restore
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/phase3-build.js
          git commit -m "restore: phase3-build.js from good commit" || exit 0
          git push origin HEAD:main
