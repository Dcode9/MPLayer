name: Patch Remotion near-black background

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run patch script
        run: python3 scripts/ci-patch-score.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/phase3-build.js remotion/LyricsTemplateVideo.jsx .github/workflows/phase7-youtube-upload.yml
          if git diff --cached --quiet; then
            echo No changes
            exit 0
          fi
          git commit -m "fix(phase3): exact title match; perf: concurrency 4 CRF 23 lighter audio"
          git push origin HEAD:main
