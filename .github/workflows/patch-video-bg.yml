name: Patch Remotion near-black background

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Soften album-art background toward near-black
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          path = Path('remotion/LyricsTemplateVideo.jsx')
          text = path.read_text()

          # Simple targeted replacements
          replacements = [
            ("opacity: 0.6,", "opacity: 0.22,"),
            ("mixBlendMode: 'screen',", "mixBlendMode: 'lighten',"),
            ("filter: `blur(${bgBlur}px) saturate(200%) brightness(0.7)`", "filter: `blur(${bgBlur + 20}px) saturate(120%) brightness(0.35)`"),
            ("radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%)", "radial-gradient(circle at center, rgba(6,8,12,0.15) 0%, rgba(0,0,0,0.92) 70%, rgba(0,0,0,0.98) 100%)"),
          ]

          for old, new in replacements:
              if old not in text:
                  print('WARNING missing:', old[:60])
              else:
                  text = text.replace(old, new, 1)
                  print('OK:', old[:40])

          # Wave opacity (first occurrence in svg style)
          if 'opacity: 0.7,' in text:
              text = text.replace('opacity: 0.7,', 'opacity: 0.45,', 1)
              print('OK: wave opacity')

          path.write_text(text)
          print('Done, bytes:', len(text))
          PY

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion/LyricsTemplateVideo.jsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(dtunes): near-black video background (subtle album art atmosphere)"
          git push origin HEAD:main
