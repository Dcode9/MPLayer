name: Patch Remotion near-black background

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply sed patches
        run: |
          set -euo pipefail
          sed -i 's/score += 120;/score += 500;/' scripts/phase3-build.js
          sed -i 's/best.score < 35/best.score < 80/' scripts/phase3-build.js
          sed -i 's/topScore < 15/topScore < 50/' scripts/phase3-build.js
          sed -i 's/PHASE5_RENDER_CONCURRENCY: 2/PHASE5_RENDER_CONCURRENCY: 4/' .github/workflows/phase7-youtube-upload.yml
          sed -i 's/PHASE5_RENDER_CRF: 20/PHASE5_RENDER_CRF: 23/' .github/workflows/phase7-youtube-upload.yml
          sed -i 's/numberOfSamples: 128/numberOfSamples: 64/' remotion/LyricsTemplateVideo.jsx
          sed -i 's/new Array(128)/new Array(64)/' remotion/LyricsTemplateVideo.jsx
          grep -n 'score += 500' scripts/phase3-build.js
          grep PHASE5_RENDER .github/workflows/phase7-youtube-upload.yml

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/phase3-build.js remotion/LyricsTemplateVideo.jsx .github/workflows/phase7-youtube-upload.yml
          git commit -m "fix+perf: exact title score boost; concurrency 4; CRF 23; audio 64" || exit 0
          git push origin HEAD:main
