name: Phase 6 Render Test (16:9)

on:
  workflow_dispatch:
    inputs:
      song_query:
        description: Song query (leave empty to auto-pick a trending query)
        required: false
        default: ''
        type: string
      song_id:
        description: Optional direct JioSaavn song ID
        required: false
        default: ''
        type: string
      render_preset:
        description: Render preset
        required: false
        default: 16x9-logo
        type: choice
        options:
          - 16x9-logo
          - 16x9-clean
          - 4k-logo
          - 4k-clean
      max_seconds:
        description: Clip duration cap in seconds (0 = full song)
        required: false
        default: '30'
        type: string

jobs:
  full-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare folders
        run: mkdir -p data output

      - name: Phase 3 - Fetch song metadata and lyrics timeline
        env:
          SONG_QUERY: ${{ inputs.song_query }}
          SONG_ID: ${{ inputs.song_id }}
        run: |
          set -e
          echo "[phase-6] Starting Phase 3"
          if [ -n "$SONG_ID" ]; then
            npm run phase3:build -- --song-id="$SONG_ID" --out=data/phase3-lyrics.json
          elif [ -n "$SONG_QUERY" ]; then
            npm run phase3:build -- --query="$SONG_QUERY" --out=data/phase3-lyrics.json
          else
            npm run phase3:build -- --auto-trending --out=data/phase3-lyrics.json
          fi

      - name: Phase 5 - Render template lyrics video
        env:
          RENDER_PRESET: ${{ inputs.render_preset }}
          PHASE5_MAX_SECONDS: ${{ inputs.max_seconds }}
          PHASE5_RENDER_CONCURRENCY: 2
          PHASE5_RENDER_CRF: 22
        run: |
          set -e
          echo "[phase-6] Starting Phase 5"
          echo "[phase-6] Render preset: $RENDER_PRESET"

          if [ "$RENDER_PRESET" = "16x9-clean" ]; then
            npm run phase5:render:16x9 -- --lyrics=data/phase3-lyrics.json --out=output/phase6-video.mp4 --max-seconds="$PHASE5_MAX_SECONDS"
          elif [ "$RENDER_PRESET" = "4k-clean" ]; then
            npm run phase5:render:4k -- --lyrics=data/phase3-lyrics.json --out=output/phase6-video.mp4 --max-seconds="$PHASE5_MAX_SECONDS"
          elif [ "$RENDER_PRESET" = "4k-logo" ]; then
            npm run phase5:render:4k:logo -- --lyrics=data/phase3-lyrics.json --out=output/phase6-video.mp4 --max-seconds="$PHASE5_MAX_SECONDS"
          else
            npm run phase5:render:16x9:logo -- --lyrics=data/phase3-lyrics.json --out=output/phase6-video.mp4 --max-seconds="$PHASE5_MAX_SECONDS"
          fi

      - name: Print output summary
        env:
          RENDER_PRESET: ${{ inputs.render_preset }}
        run: |
          set -e
          echo "[phase-6] Selected preset: $RENDER_PRESET"
          ls -lh output/phase6-video.mp4 data/phase3-lyrics.json
          node -e "const {getVideoMetadata}=require('@remotion/renderer'); getVideoMetadata('output/phase6-video.mp4').then((m)=>{console.log(JSON.stringify({width:m.width,height:m.height,fps:m.fps,durationInSeconds:m.durationInSeconds},null,2));}).catch((e)=>{console.error(e);process.exit(1);});"

      - name: Upload Phase 6 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase6-full-pipeline
          if-no-files-found: error
          path: |
            output/phase6-video.mp4
            data/phase3-lyrics.json
