name: Phase 7 Render + YouTube Upload

run-name: Phase 7 Upload • ${{ inputs.song_query || inputs.song_id || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      song_query:
        description: Song query (used only when song_id is empty)
        required: false
        default: Aaj Ki Raat
        type: string
      song_id:
        description: Optional direct JioSaavn song ID
        required: false
        default: ''
        type: string
      render_preset:
        description: Render preset
        required: false
        default: 4k-logo
        type: choice
        options:
          - 4k-logo
          - 4k-clean
      youtube_title:
        description: Optional YouTube title override
        required: false
        default: ''
        type: string
      youtube_description:
        description: Optional YouTube description override
        required: false
        default: ''
        type: string
      youtube_tags:
        description: Optional comma-separated tags
        required: false
        default: ''
        type: string
      privacy_status:
        description: YouTube privacy status
        required: false
        default: unlisted
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra

      - name: Prepare folders
        run: mkdir -p data output

      - name: Phase 3 - Fetch song and lyrics
        env:
          SONG_QUERY: ${{ inputs.song_query }}
          SONG_ID: ${{ inputs.song_id }}
        run: |
          set -e
          echo "[phase-7] Starting Phase 3"
          if [ -n "$SONG_ID" ]; then
            npm run phase3:build -- --song-id="$SONG_ID" --out=data/phase3-lyrics.json
          else
            npm run phase3:build -- --query="$SONG_QUERY" --out=data/phase3-lyrics.json
          fi

      - name: Phase 5 - Render video
        env:
          RENDER_PRESET: ${{ inputs.render_preset }}
          PHASE5_RENDER_CONCURRENCY: 2
          PHASE5_RENDER_CRF: 20
        run: |
          set -e
          echo "[phase-7] Starting Phase 5"
          echo "[phase-7] Render preset: $RENDER_PRESET"

          if [ "$RENDER_PRESET" = "4k-clean" ]; then
            npm run phase5:render:4k -- --lyrics=data/phase3-lyrics.json --out=output/phase7-video.mp4
          else
            npm run phase5:render:4k:logo -- --lyrics=data/phase3-lyrics.json --out=output/phase7-video.mp4
          fi

      - name: Phase 7 - Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_TITLE: ${{ inputs.youtube_title }}
          YOUTUBE_DESCRIPTION: ${{ inputs.youtube_description }}
          YOUTUBE_TAGS: ${{ inputs.youtube_tags }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy_status }}
          YOUTUBE_ENABLE_AI_METADATA: true
          YOUTUBE_METADATA_MODEL: glm
          YOUTUBE_GENERATE_THUMBNAIL: true
          YOUTUBE_THUMBNAIL_MODEL: gptimage-large
          PHASE7_VIDEO_FILE: output/phase7-video.mp4
          PHASE7_PHASE3_JSON: data/phase3-lyrics.json
          PHASE7_OUTPUT_JSON: data/phase7-youtube-upload.json
          PHASE7_THUMBNAIL_FILE: output/phase7-thumbnail.jpg
        run: |
          set -e
          echo "[phase-7] Starting YouTube upload"
          npm run phase7:upload

      - name: Upload Phase 7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase7-youtube-upload
          if-no-files-found: error
          path: |
            output/phase7-video.mp4
            output/phase7-thumbnail.jpg
            data/phase3-lyrics.json
            data/phase7-youtube-upload.json
