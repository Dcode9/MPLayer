name: Optimize render + song match patch

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch phase7 workflow render env + phase3 scoring + audio samples
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # --- phase7 workflow: concurrency 4, crf 23, veryfast ---
          wf = Path('.github/workflows/phase7-youtube-upload.yml')
          w = wf.read_text()
          w = w.replace('PHASE5_RENDER_CONCURRENCY: 2', 'PHASE5_RENDER_CONCURRENCY: 4')
          w = w.replace('PHASE5_RENDER_CRF: 20', 'PHASE5_RENDER_CRF: 23')
          if 'PHASE5_X264_PRESET' not in w:
              w = w.replace(
                  'PHASE5_RENDER_CRF: 23',
                  'PHASE5_RENDER_CRF: 23\n          PHASE5_X264_PRESET: veryfast',
              )
          wf.write_text(w)
          print('phase7 workflow patched')

          # --- phase3: stricter title matching ---
          p3 = Path('scripts/phase3-build.js')
          t = p3.read_text()

          old_score = '''const scoreSongForQuery = (song, query) => {
  const normalizedQuery = normalizeSearchText(query);
  if (!normalizedQuery) {
    return 0;
  }

  const songName = normalizeSearchText(song?.name || '');
  const artistName = normalizeSearchText(song?.artist || '');
  const haystack = `${songName} ${artistName}`.trim();
  const queryTokens = normalizedQuery.split(/\\s+/).filter(Boolean);
  const titleTokens = songName.split(/\\s+/).filter(Boolean);

  let score = 0;

  if (songName === normalizedQuery) {
    score += 120;
  }

  if (haystack === normalizedQuery) {
    score += 80;
  }

  if (songName.startsWith(normalizedQuery)) {
    score += 50;
  }

  if (songName.includes(normalizedQuery)) {
    score += 36;
  }

  for (const token of queryTokens) {
    if (titleTokens.includes(token)) {
      score += 18;
    } else if (songName.includes(token)) {
      score += 10;
    }

    if (artistName.includes(token)) {
      score += 5;
    }
  }

  if (queryTokens.length === 1 && queryTokens[0].length <= 4 && titleTokens.includes(queryTokens[0])) {
    score += 35;
  }

  return score;
};'''

          new_score = '''const scoreSongForQuery = (song, query) => {
  const normalizedQuery = normalizeSearchText(query);
  if (!normalizedQuery) {
    return 0;
  }

  const songName = normalizeSearchText(song?.name || '');
  const artistName = normalizeSearchText(song?.artist || '');
  const albumName = normalizeSearchText(song?.album || '');
  const haystack = `${songName} ${artistName}`.trim();
  const queryTokens = normalizedQuery.split(/\\s+/).filter(Boolean);
  const titleTokens = songName.split(/\\s+/).filter(Boolean);

  // Primary title token = first meaningful query word (e.g. "saiyaara" from "Saiyaara Arijit")
  const primaryToken = queryTokens[0] || '';

  let score = 0;

  // Exact / near-exact title wins hard (prevents "Dhun" beating "Saiyaara")
  if (songName === normalizedQuery) {
    score += 500;
  } else if (titleTokens.join(' ') === queryTokens.slice(0, titleTokens.length).join(' ')) {
    score += 420;
  } else if (primaryToken && songName === primaryToken) {
    score += 400;
  } else if (primaryToken && titleTokens[0] === primaryToken && titleTokens.length <= queryTokens.length + 1) {
    score += 320;
  }

  if (haystack === normalizedQuery) {
    score += 80;
  }

  if (songName.startsWith(normalizedQuery) || (primaryToken && songName.startsWith(primaryToken))) {
    score += 50;
  }

  if (songName.includes(normalizedQuery)) {
    score += 36;
  }

  // Token overlap on title (strong) vs artist (weak)
  let titleHits = 0;
  for (const token of queryTokens) {
    if (titleTokens.includes(token)) {
      score += 22;
      titleHits += 1;
    } else if (songName.includes(token)) {
      score += 10;
    }
    if (artistName.includes(token)) {
      score += 4;
    }
  }

  // Require real title signal: if primary token is not in the song title, heavy penalty
  if (primaryToken && primaryToken.length >= 4 && !songName.includes(primaryToken) && !titleTokens.includes(primaryToken)) {
    // Album-only match (e.g. song "Dhun" from album "Saiyaara") should lose
    if (albumName.includes(primaryToken)) {
      score -= 200;
    } else {
      score -= 120;
    }
  }

  // Penalize instrumental / version suffixes when query looks like a main title
  const versionHints = ['dhun', 'theme', 'instrumental', 'karaoke', 'bgm', 'score', 'ost', 'reprise'];
  if (versionHints.some((h) => titleTokens.includes(h)) && primaryToken && !versionHints.includes(primaryToken)) {
    score -= 150;
  }

  if (queryTokens.length === 1 && queryTokens[0].length <= 4 && titleTokens.includes(queryTokens[0])) {
    score += 35;
  }

  // Prefer fewer extra words in title when query is short
  if (queryTokens.length <= 2 && titleTokens.length > queryTokens.length + 2) {
    score -= 25;
  }

  return score;
};'''

          if old_score not in t:
              print('WARNING: scoreSongForQuery block not found exactly')
          else:
              t = t.replace(old_score, new_score)
              print('phase3 scoring patched')

          # Raise minimum score threshold for approved candidates
          t = t.replace('best.score < 35', 'best.score < 80')
          t = t.replace('topScore < 15', 'topScore < 50')

          p3.write_text(t)

          # --- lighter audio viz in Remotion (64 samples instead of 128) ---
          rem = Path('remotion/LyricsTemplateVideo.jsx')
          r = rem.read_text()
          r2 = r.replace('numberOfSamples: 128', 'numberOfSamples: 64')
          r2 = r2.replace('return new Array(128).fill(0);', 'return new Array(64).fill(0);')
          if r2 == r:
              print('WARNING: audio sample constants not found')
          else:
              rem.write_text(r2)
              print('audio viz samples reduced to 64')

          print('all patches applied')
          PY

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/phase3-build.js remotion/LyricsTemplateVideo.jsx .github/workflows/phase7-youtube-upload.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(phase3): exact-title JioSaavn match; perf: faster CI render + lighter audio viz"
          git push origin HEAD:main
