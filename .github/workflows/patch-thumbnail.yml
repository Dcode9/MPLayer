name: Patch phase7 thumbnail (near-black)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply near-black thumbnail patch
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          path = Path('scripts/phase7-upload.js')
          text = path.read_text()

          old_palette = '''const pickThemePalette = (seed) => {
            const palettes = [
              {
                bgStart: '#0b1220',
                bgEnd: '#1f2937',
                accent: '#22d3ee',
                accentSoft: '#93c5fd',
                text: '#f8fafc',
                subText: '#cbd5e1',
              },
              {
                bgStart: '#1a102f',
                bgEnd: '#2b164f',
                accent: '#f59e0b',
                accentSoft: '#fcd34d',
                text: '#fff7ed',
                subText: '#fed7aa',
              },
              {
                bgStart: '#081c15',
                bgEnd: '#1b4332',
                accent: '#52b788',
                accentSoft: '#95d5b2',
                text: '#f1faee',
                subText: '#b7e4c7',
              },
              {
                bgStart: '#1f1300',
                bgEnd: '#3f2a14',
                accent: '#fb7185',
                accentSoft: '#fda4af',
                text: '#fff1f2',
                subText: '#fecdd3',
              },
            ];
            return palettes[seed % palettes.length];
          };'''

          new_palette = '''const pickThemePalette = (seed) => {
            // Near-black minimal palettes for D'Tunes identity
            const palettes = [
              {
                bgStart: '#05070c',
                bgEnd: '#0e1218',
                accent: '#67e8f9',
                accentSoft: '#a5f3fc',
                text: '#f8fafc',
                subText: '#94a3b8',
              },
              {
                bgStart: '#07070b',
                bgEnd: '#12121a',
                accent: '#c4b5fd',
                accentSoft: '#ddd6fe',
                text: '#f8fafc',
                subText: '#a1a1aa',
              },
              {
                bgStart: '#06080c',
                bgEnd: '#10151c',
                accent: '#7dd3fc',
                accentSoft: '#bae6fd',
                text: '#f1f5f9',
                subText: '#94a3b8',
              },
              {
                bgStart: '#08060a',
                bgEnd: '#141018',
                accent: '#f0abfc',
                accentSoft: '#f5d0fe',
                text: '#fafafa',
                subText: '#a3a3a3',
              },
            ];
            return palettes[seed % palettes.length];
          };'''

          if old_palette not in text:
              raise SystemExit('palette block not found')
          text = text.replace(old_palette, new_palette)

          # Left title / right album layout markers
          text = text.replace(
              "const titleLines = splitHeadline(songName || metadata?.title || 'Lyrical Video', 20, 3)",
              "const titleLines = splitHeadline(songName || metadata?.title || 'Lyrical Video', 18, 3)",
          )
          text = text.replace(
              'font-size="76" font-weight="800" fill="${palette.text}"',
              'font-size="70" font-weight="800" fill="${palette.text}"',
          )
          text = text.replace('x="80" y="${210 + (index * 92)}"', 'x="72" y="${230 + (index * 88)}"')
          text = text.replace(
              '<text x="108" y="90" font-family="Noto Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="${palette.accentSoft}">D\'Tunes • Lyrical Video</text>',
              '<text x="72" y="88" font-family="Noto Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="${palette.accentSoft}">D\'Tunes • Lyrical</text>',
          )
          text = text.replace(
              '<text x="82" y="560" font-family="Noto Sans, Arial, sans-serif" font-size="34" font-weight="600" fill="${palette.subText}">${credits}</text>',
              '<text x="72" y="520" font-family="Noto Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="${palette.subText}">${credits}</text>',
          )
          text = text.replace(
              '<rect x="80" y="598" width="360" height="62" rx="16" fill="${palette.accent}" opacity="0.96"/>',
              '<rect x="72" y="560" width="300" height="54" rx="14" fill="${palette.accent}" opacity="0.95"/>',
          )
          text = text.replace(
              '<text x="106" y="640" font-family="Noto Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#081018">Ad-Free, Lyrical</text>',
              '<text x="94" y="596" font-family="Noto Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#0a0a0f">Ad-Free, Lyrical</text>',
          )
          # Remove left accent bar (old design)
          text = text.replace(
              '<rect x="72" y="110" width="20" height="510" rx="10" fill="${palette.accent}" opacity="0.95"/>\n        ',
              '',
          )
          text = text.replace("const coverSize = 430;", "const coverSize = 460;")
          text = text.replace(
              'composites.push({input: framedCover, left: 790, top: 145});\n        composites.push({input: frameSvg, left: 770, top: 125});',
              'composites.push({input: framedCover, left: 760, top: 130});\n        composites.push({input: frameSvg, left: 740, top: 110});',
          )
          text = text.replace("background: '#0b1220'", "background: '#06080c'")

          path.write_text(text)
          print('Patched successfully, bytes:', len(text))
          PY

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/phase7-upload.js
          if git diff --cached --quiet; then
            echo "No changes after patch"
            exit 0
          fi
          git commit -m "feat(dtunes): near-black minimal thumbnail (left title, right album art)"
          git push origin HEAD:main
