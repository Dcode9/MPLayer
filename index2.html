<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Tunes</title>
    <link rel="icon" href="data:,">

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                colors: {
                    accent: { DEFAULT: '#3ecf8e', dark: '#2ba06c', light: '#6ee7b7' },
                    surface: { DEFAULT: '#0a0a0f', raised: '#12121a', overlay: '#1a1a25' }
                },
                backdropBlur: { pill: '16px' },
                animation: {
                    'slide-text': 'slideText 8s linear infinite',
                    'spin-slow': 'spin 8s linear infinite',
                    'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                    'fade-in': 'fadeIn 0.5s ease forwards',
                    'slide-up': 'slideUp 0.3s ease forwards',
                    'skeleton': 'skeletonLoad 1.5s infinite',
                }
            }
        }
    }
    </script>

    <style>
    /* ============================================
       D'Tunes v2 — Premium Dark-Mode Stylesheet
       ============================================ */

    :root {
        --angle: 0deg;
        --album-art-gradient: conic-gradient(from var(--angle), #434343, #000000, #434343);
        --accent: #3ecf8e;
        --accent-glow: rgba(62, 207, 142, 0.3);
        --surface: #0a0a0f;
        --surface-raised: #12121a;
        --surface-overlay: #1a1a25;
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-hover: rgba(255, 255, 255, 0.12);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
        background-color: var(--surface);
        color: white;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* === Dynamic Background System === */
    #background-container {
        position: fixed; inset: 0; z-index: 0;
        overflow: hidden; pointer-events: none;
    }
    .background-layer {
        position: absolute; inset: 0;
        transition: opacity 1.5s ease-in-out, background 1.5s ease;
        will-change: opacity, background;
    }
    #background-playing { opacity: 0; }
    #ripple-effect {
        position: absolute; top: 50%; left: 50%;
        width: 150vmax; height: 150vmax;
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
        opacity: 0; filter: blur(80px);
        transition: transform 0.1s linear, opacity 0.2s ease;
        pointer-events: none;
        will-change: transform, opacity;
    }
    #ripple-effect.active { opacity: 0.15; }

    /* === Unified Glass Pill System === */
    .glass-pill {
        background: rgba(0, 0, 0, 0.40);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        transition: all 0.3s ease;
    }
    .glass-pill-light {
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        transition: all 0.3s ease;
    }
    .glass-pill-light:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.15);
    }

    /* === Sidebar Navigation === */
    #nav-panel {
        background: rgba(0, 0, 0, 0.40);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-right: 1px solid var(--glass-border);
    }
    .nav-btn {
        position: relative;
        border-radius: 0.75rem;
        overflow: hidden;
    }
    .nav-btn::before {
        content: '';
        position: absolute; right: 0; top: 50%;
        transform: translateY(-50%);
        width: 3px; height: 0;
        background: var(--accent);
        border-radius: 3px;
        transition: height 0.3s ease;
    }
    .nav-btn.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
    }
    .nav-btn.active::before {
        height: 60%;
    }

    /* === Main Content Area === */
    #main-view {
        background: transparent;
        position: relative;
        z-index: 10;
    }
    #main-view::-webkit-scrollbar { width: 6px; }
    #main-view::-webkit-scrollbar-track { background: transparent; }
    #main-view::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
    }
    #main-view::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    /* === Seek Bar & Visualizer === */
    #seek-bar-container {
        position: relative; width: 100%; height: 60px;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.3s;
        touch-action: none;
    }
    #seek-bar-container.disabled { opacity: 0.3; pointer-events: none; }
    #seek-bar-track {
        position: absolute; height: 2px; width: 100%;
        background-color: rgba(255, 255, 255, 0.12);
        border-radius: 3px; top: 50%; transform: translateY(-50%);
        clip-path: inset(0 0 0 0%);
        transition: height 0.2s;
        pointer-events: none;
    }
    #visualizer-canvas {
        position: absolute; left: 0; top: 0;
        width: 100%; height: 100%;
        pointer-events: none; z-index: 1;
        clip-path: inset(0 100% 0 0);
    }
    input[type="range"]#seek-bar {
        -webkit-appearance: none; appearance: none;
        position: absolute;
        bottom: 0; left: 0;
        width: 100%; height: 50%;
        background: transparent; outline: none;
        margin: 0; padding: 0; z-index: 2;
        cursor: pointer;
    }
    input[type="range"]#seek-bar::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(255,255,255,0.3), 0 2px 8px rgba(0,0,0,0.4);
        transition: transform 0.15s ease;
        transform: translateY(-100%);
        position: relative;
    }
    input[type="range"]#seek-bar:disabled::-webkit-slider-thumb { display: none; }
    input[type="range"]#seek-bar::-webkit-slider-thumb:hover {
        transform: translateY(-100%) scale(1.4);
    }

    /* === Seek Tooltip === */
    #seek-tooltip {
        position: absolute;
        top: -36px;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        color: white;
        font-size: 11px;
        font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
        padding: 4px 10px;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transform: translateX(-50%) translateY(6px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 20;
        border: 1px solid rgba(255, 255, 255, 0.08);
        white-space: nowrap;
    }
    #seek-tooltip.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    /* === Search Bar === */
    .search-container { position: relative; }
    .search-input {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 9999px;
        padding: 0.7rem 1rem 0.7rem 2.5rem;
        width: 100%;
        color: white;
        font-size: 0.875rem;
        transition: all 0.3s ease;
    }
    .search-input::placeholder { color: rgba(255, 255, 255, 0.35); }
    .search-input:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.4);
        transition: color 0.3s;
    }
    .search-container:focus-within .search-icon { color: var(--accent); }
    .search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0; right: 0;
        background: rgba(10, 10, 15, 0.95);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 1rem;
        max-height: 60vh;
        overflow-y: auto;
        z-index: 100;
        display: none;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .search-results.active { display: block; }
    .search-results::-webkit-scrollbar { width: 4px; }
    .search-results::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
    }
    .search-result-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0.75rem;
        cursor: pointer;
        transition: background 0.2s;
        border-radius: 0.5rem;
        margin: 2px 4px;
    }
    .search-result-item:hover { background: rgba(255, 255, 255, 0.08); }
    .search-result-item img {
        width: 44px; height: 44px;
        border-radius: 0.5rem;
        object-fit: cover;
    }
    .search-section-title {
        padding: 0.625rem 0.75rem 0.375rem;
        font-size: 0.6875rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    /* === Quality Selector === */
    .quality-selector {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 0.5rem;
        padding: 0.375rem 0.5rem;
        color: white;
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .quality-selector:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .quality-selector option { background: #1a1a25; color: white; }

    /* === Loading States === */
    .loading-spinner {
        display: inline-block;
        width: 20px; height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        border-top-color: var(--accent);
        animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .skeleton {
        background: linear-gradient(90deg,
            rgba(255,255,255,0.04) 25%,
            rgba(255,255,255,0.08) 50%,
            rgba(255,255,255,0.04) 75%
        );
        background-size: 200% 100%;
        animation: skeletonLoad 1.5s infinite;
        border-radius: 0.75rem;
    }
    @keyframes skeletonLoad {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    /* === Error Toast === */
    .error-toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(239, 68, 68, 0.90);
        backdrop-filter: blur(12px);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        z-index: 200;
        font-size: 0.875rem;
        font-weight: 500;
        animation: slideUp 0.3s ease;
        box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateX(-50%) translateY(20px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* === Tab Pills (Unified Pill Design) === */
    .tab-pills {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
    }
    .tab-pill {
        padding: 0.5rem 1.25rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.8125rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.25s ease;
        border: 1px solid transparent;
    }
    .tab-pill:hover {
        background: rgba(255, 255, 255, 0.10);
        color: rgba(255, 255, 255, 0.7);
    }
    .tab-pill.active {
        background: var(--accent);
        color: black;
        font-weight: 600;
        box-shadow: 0 4px 16px var(--accent-glow);
    }

    /* === Content Cards === */
    .content-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 1rem;
        padding: 0.875rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .content-card::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(135deg, transparent 60%, rgba(62, 207, 142, 0.03));
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        border-radius: inherit;
    }
    .content-card:hover {
        background: var(--glass-hover);
        border-color: rgba(255, 255, 255, 0.12);
        transform: translateY(-3px);
        box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .content-card:hover::after { opacity: 1; }
    .content-card img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 0.625rem;
        margin-bottom: 0.75rem;
    }
    .content-card.artist img { border-radius: 50%; }

    /* === Album Art Effects === */
    #album-art-wrapper {
        transition: transform 0.3s ease;
        position: relative;
    }
    #album-art-wrapper:hover { transform: scale(1.08); }
    #album-art-glow {
        position: absolute;
        inset: -6px;
        z-index: -1;
        background: var(--album-art-gradient);
        filter: blur(15px);
        opacity: 0.7;
        animation: spin 8s linear infinite;
        border-radius: 50%;
        will-change: transform;
    }

    /* === View Sections === */
    .view-section { display: none; }
    .view-section.active {
        display: block;
        animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* === Horizontal Scroll Sections === */
    .horizontal-scroll {
        display: flex;
        gap: 1rem;
        overflow-x: auto;
        padding-bottom: 0.75rem;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
    }
    .horizontal-scroll > * {
        scroll-snap-align: start;
        flex-shrink: 0;
    }
    .horizontal-scroll::-webkit-scrollbar { height: 3px; }
    .horizontal-scroll::-webkit-scrollbar-track { background: transparent; }
    .horizontal-scroll::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
    }
    .horizontal-scroll > .scroll-card {
        min-width: 170px;
        max-width: 170px;
    }

    /* === Sliding Text Animation === */
    @keyframes slideText {
        0%, 10% { transform: translateX(0); }
        45%, 55% { transform: translateX(var(--slide-distance)); }
        90%, 100% { transform: translateX(0); }
    }
    .slide-text-container {
        overflow: hidden;
        position: relative;
        mask-image: linear-gradient(to right, black 85%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
    }
    .slide-text {
        display: inline-block;
        white-space: nowrap;
    }
    .slide-text.sliding { animation: slideText 8s linear infinite; }

    /* === Utilities === */
    .hidden { display: none !important; }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    button.active-state { color: var(--accent); }
    button.active-state svg { fill: var(--accent-glow); }

    /* === Source Badge === */
    .source-badge {
        font-size: 0.625rem;
        padding: 0.125rem 0.5rem;
        border-radius: 9999px;
        background: rgba(62, 207, 142, 0.15);
        color: var(--accent);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.05em;
    }
    .source-badge.jiosaavn {
        background: rgba(139, 92, 246, 0.15);
        color: #a78bfa;
    }

    /* === Search Results Main View === */
    .search-top-result {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 1rem;
        padding: 1.5rem;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 1.5rem;
    }
    .search-top-result:hover {
        background: var(--glass-hover);
        border-color: rgba(255, 255, 255, 0.12);
    }
    .search-top-result img {
        width: 120px; height: 120px;
        border-radius: 0.75rem;
        object-fit: cover;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* === Config Modal === */
    #config-modal {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.7);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
    }

    /* === Volume Slider === */
    input[type="range"].volume-slider {
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
        outline: none;
    }
    input[type="range"].volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px; height: 12px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* === Responsive === */
    @media (max-width: 768px) {
        #nav-panel { display: none; }
        #player-footer { left: 1rem; right: 1rem; bottom: 1rem; }
    }

    /* === Smooth hover animations === */
    .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    /* === Pulse animation for now-playing indicator === */
    @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
        50% { box-shadow: 0 0 0 8px transparent; }
    }
    </style>
</head>
<body class="paused">

    <!-- === DYNAMIC BACKGROUND === -->
    <div id="background-container">
        <div id="background-paused" class="background-layer" style="background: radial-gradient(ellipse at top, #111827 0%, #030712 100%);"></div>
        <div id="background-playing" class="background-layer" style="background: radial-gradient(ellipse at top, #111827 0%, #030712 100%);"></div>
        <div id="ripple-effect"></div>
    </div>

    <!-- === MAIN LAYOUT === -->
    <div class="flex h-screen relative z-10">

        <!-- ======= SIDEBAR ======= -->
        <div id="nav-panel" class="w-64 flex-shrink-0 flex flex-col p-5 gap-5 h-full">

            <!-- Logo -->
            <div class="flex items-center gap-3 px-2 mb-2">
                <div class="w-9 h-9 bg-accent/15 rounded-xl flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-accent" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                </div>
                <span class="text-xl font-bold text-white tracking-tight">D'Tunes</span>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <svg class="search-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" class="search-input" id="search-input" placeholder="Search songs, albums, artists..." autocomplete="off">
                <div class="search-results" id="search-results"></div>
            </div>

            <!-- Navigation -->
            <nav class="flex flex-col gap-1.5">
                <button class="nav-btn active flex items-center gap-3.5 p-3 text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium" onclick="router.go('home')">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Home
                </button>
                <button class="nav-btn flex items-center gap-3.5 p-3 text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium" onclick="router.go('trending')">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                    Trending
                </button>
                <button class="nav-btn flex items-center gap-3.5 p-3 text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium" onclick="router.go('albums')">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    Albums
                </button>
                <button class="nav-btn flex items-center gap-3.5 p-3 text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium" onclick="router.go('playlists')">
                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 10h16M4 14h10m-10 4h6"/></svg>
                    Playlists
                </button>
            </nav>

            <!-- Bottom: Quality Selector -->
            <div class="mt-auto pt-4 border-t border-white/5">
                <label class="text-[11px] text-gray-500 font-medium uppercase tracking-wider block mb-1.5">Audio Quality</label>
                <select class="quality-selector w-full" id="quality-selector" onchange="preferences.setQuality(this.value)">
                    <option value="12kbps">12kbps (Low)</option>
                    <option value="48kbps">48kbps (Medium)</option>
                    <option value="96kbps">96kbps (Good)</option>
                    <option value="160kbps" selected>160kbps (High)</option>
                    <option value="320kbps">320kbps (Best)</option>
                </select>
            </div>
        </div>

        <!-- ======= MAIN CONTENT ======= -->
        <div id="main-view" class="flex-1 overflow-y-auto p-8 pb-48">
            <!-- Error Toast Container -->
            <div id="error-toast-container"></div>

            <!-- === HOME VIEW === -->
            <div id="view-home" class="view-section active space-y-10">
                <div>
                    <div class="flex items-center justify-between mb-5">
                        <h2 class="text-2xl font-bold text-white">Quick Picks</h2>
                        <span class="text-xs text-gray-500 font-medium">Recommended for you</span>
                    </div>
                    <div id="quick-picks-grid" class="horizontal-scroll"></div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-5">
                        <h2 class="text-2xl font-bold text-white">Recently Played</h2>
                    </div>
                    <div id="recent-grid" class="horizontal-scroll"></div>
                </div>
            </div>

            <!-- === TRENDING VIEW === -->
            <div id="view-trending" class="view-section space-y-6">
                <div class="flex items-end justify-between">
                    <h2 class="text-3xl font-bold text-white">Trending</h2>
                </div>
                <div class="tab-pills" id="trending-tabs">
                    <button class="tab-pill active" onclick="trendingView.switchTab('songs')">Songs</button>
                    <button class="tab-pill" onclick="trendingView.switchTab('albums')">Albums</button>
                    <button class="tab-pill" onclick="trendingView.switchTab('artists')">Artists</button>
                </div>
                <div id="trending-content">
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                        <div class="skeleton h-52 w-full"></div>
                        <div class="skeleton h-52 w-full"></div>
                        <div class="skeleton h-52 w-full"></div>
                        <div class="skeleton h-52 w-full"></div>
                    </div>
                </div>
            </div>

            <!-- === ALBUMS VIEW === -->
            <div id="view-albums" class="view-section space-y-6">
                <h2 class="text-3xl font-bold text-white">Top Albums</h2>
                <div id="albums-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
                    <div class="skeleton h-52 w-full"></div>
                    <div class="skeleton h-52 w-full"></div>
                    <div class="skeleton h-52 w-full"></div>
                    <div class="skeleton h-52 w-full"></div>
                </div>
            </div>

            <!-- === ALBUM DETAIL VIEW === -->
            <div id="view-album-detail" class="view-section space-y-6">
                <button onclick="history.back()" class="text-gray-400 hover:text-white transition-colors mb-4 flex items-center gap-2 text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    Back
                </button>
                <div id="album-detail-header" class="flex gap-6 items-end mb-8"></div>
                <div id="album-detail-tracks" class="space-y-1"></div>
            </div>

            <!-- === PLAYLISTS VIEW === -->
            <div id="view-playlists" class="view-section space-y-8">
                <h2 class="text-3xl font-bold text-white">Playlists</h2>

                <div class="glass-pill-light rounded-2xl p-6">
                    <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h10m-10 4h6"/></svg>
                        Up Next
                    </h3>
                    <div id="queue-list" class="space-y-1">
                        <p class="text-gray-500 text-sm">No songs in queue</p>
                    </div>
                </div>

                <div class="glass-pill-light rounded-2xl p-6">
                    <h3 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                        <svg class="w-5 h-5 text-red-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        Liked Songs
                    </h3>
                    <p class="text-gray-500 text-xs mb-3">Songs you've liked will appear here</p>
                    <div id="liked-list" class="space-y-1"></div>
                </div>
            </div>

            <!-- === SEARCH RESULTS VIEW === -->
            <div id="view-search" class="view-section space-y-6">
                <div id="search-results-main"></div>
            </div>
        </div>
    </div>

    <!-- ======= PLAYER FOOTER STACK ======= -->
    <div id="player-footer" class="fixed bottom-5 left-5 right-5 z-50 flex flex-col items-start gap-1 pointer-events-none">

        <!-- INFO ISLAND -->
        <div class="glass-pill rounded-[24px] rounded-bl-[8px] p-3 pr-5 flex items-center gap-3 shadow-2xl pointer-events-auto"
             id="info-island" style="opacity:0; transform:translateY(10px);">
            <div id="album-art-wrapper" class="relative w-12 h-12 flex-shrink-0 transition-opacity duration-300">
                <div id="album-art-glow"></div>
                <img id="curr-art-img" src="https://placehold.co/300/1a1a25/666?text=♪" alt="Album artwork" class="w-full h-full rounded-full object-cover border border-white/10" crossorigin="anonymous">
            </div>
            <div class="overflow-hidden min-w-[100px] max-w-[200px]">
                <div class="slide-text-container">
                    <h3 id="p-title" class="font-semibold text-white slide-text text-sm">Not Playing</h3>
                </div>
                <div class="slide-text-container">
                    <p id="p-artist" class="text-xs text-gray-400 slide-text">Select a song to play</p>
                </div>
            </div>
            <button onclick="player.toggleLike()" id="p-like-btn" class="text-gray-500 hover:text-red-400 transition disabled:opacity-30 ml-1 flex-shrink-0" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
        </div>

        <!-- MAIN PLAYER PILL -->
        <div class="w-full glass-pill rounded-full shadow-2xl p-2 px-4 flex items-center gap-4 h-[72px] pointer-events-auto" id="player-card">

            <!-- Left: Playback Controls -->
            <div class="flex items-center gap-3">
                <button onclick="player.togglePlay()" id="btn-play"
                    class="w-10 h-10 bg-white rounded-full flex-shrink-0 flex items-center justify-center text-black hover:scale-105 active:scale-95 transition-all shadow-lg shadow-white/10 disabled:bg-gray-600 disabled:scale-100 disabled:cursor-not-allowed disabled:shadow-none" disabled>
                    <span id="icon-play" class="flex ml-0.5"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
                    <span id="icon-pause" class="hidden"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span>
                </button>
                <button class="text-gray-400 hover:text-white disabled:opacity-30 disabled:hover:text-gray-400 flex-shrink-0 transition-colors" onclick="player.prev()" id="btn-prev" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                </button>
                <button class="text-gray-400 hover:text-white disabled:opacity-30 disabled:hover:text-gray-400 flex-shrink-0 transition-colors" onclick="player.next()" id="btn-next" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                </button>
            </div>

            <!-- Center: Waveform / Seek Bar -->
            <div class="flex-1 h-full relative flex items-center group px-3 border-l border-r border-white/[0.04]">
                <div id="seek-bar-container" class="w-full h-[60px] disabled relative">
                    <div id="seek-tooltip">0:00</div>
                    <div id="seek-bar-track"></div>
                    <canvas id="visualizer-canvas"></canvas>
                    <input type="range" id="seek-bar" value="0" step="0.1" disabled>
                </div>
            </div>

            <!-- Right: Extra Controls -->
            <div class="flex items-center gap-2.5">
                <button class="text-gray-500 hover:text-white disabled:opacity-30 transition-colors" onclick="player.toggleShuffle()" id="btn-shuffle" disabled title="Shuffle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                </button>
                <button class="text-gray-500 hover:text-white disabled:opacity-30 transition-colors" onclick="player.toggleRepeat()" id="btn-repeat" disabled title="Repeat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
                <button class="text-gray-500 hover:text-white disabled:opacity-30 transition-colors" onclick="pipManager.toggle()" id="btn-pip" disabled title="Mini Player">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><rect x="12" y="12" width="6" height="5"></rect></svg>
                </button>
                <div class="w-20 hidden md:flex items-center gap-2">
                    <svg class="w-3.5 h-3.5 text-gray-500 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    <input type="range" min="0" max="1" step="0.05" value="1" oninput="player.setVolume(this.value)" class="volume-slider w-full cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- === HIDDEN MEDIA ELEMENTS === -->
    <audio id="audio-el" crossorigin="anonymous" class="hidden"></audio>
    <canvas id="pip-canvas" width="500" height="500" class="hidden"></canvas>
    <video id="pip-video" muted class="hidden"></video>

    <!-- === JAVASCRIPT MODULES (Legacy API + Seek Bar logic preserved) === -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/visualizer.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/views.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
